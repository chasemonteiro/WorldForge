<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090907">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tarnished Covenant">
  <title>The Tarnished Covenant</title>
  <style>:root{
  color-scheme:dark;
  --bg:#080806;--bg2:#0d0c09;--paper:#14120e;--paper2:#1a1711;--ink:#eee6d4;--ash:#9f9683;
  --line:#393326;--line-soft:#262219;--gold:#c6a15a;--gold-bright:#e0c17b;--red:#c9665a;--violet:#9780ad;
  --region-glow:rgba(149,120,65,.14);--region-glow2:rgba(67,56,34,.09);
  font-family:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:
  radial-gradient(ellipse at 50% -10%,var(--region-glow),transparent 42%),
  radial-gradient(ellipse at 100% 55%,var(--region-glow2),transparent 40%),
  linear-gradient(180deg,#0b0a08 0%,var(--bg) 48%,#050504 100%);background-attachment:fixed;transition:background .35s ease}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:repeating-linear-gradient(8deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
body[data-region="caelid"]{--region-glow:rgba(115,26,20,.25);--region-glow2:rgba(100,53,20,.10)}
body[data-region="liurnia"]{--region-glow:rgba(55,78,105,.23);--region-glow2:rgba(78,104,114,.09)}
body[data-region="leyndell"]{--region-glow:rgba(181,131,47,.20);--region-glow2:rgba(116,80,28,.12)}
body[data-region="gelmir"],body[data-region="jagged"]{--region-glow:rgba(122,48,22,.23);--region-glow2:rgba(83,25,14,.12)}
body[data-region="snow"]{--region-glow:rgba(138,156,163,.16);--region-glow2:rgba(84,98,111,.10)}
body[data-region="haligtree"],body[data-region="enir"]{--region-glow:rgba(207,191,128,.16);--region-glow2:rgba(111,123,78,.10)}
body[data-region="farum"]{--region-glow:rgba(121,104,82,.18);--region-glow2:rgba(84,65,46,.12)}
body[data-region="gravesite"],body[data-region="shadow"]{--region-glow:rgba(76,70,53,.23);--region-glow2:rgba(97,64,45,.09)}
body[data-region="coast"]{--region-glow:rgba(46,94,104,.20);--region-glow2:rgba(49,69,103,.10)}
body[data-region="abyss"]{--region-glow:rgba(100,73,38,.17);--region-glow2:rgba(62,53,38,.10)}
body[data-region="rauh"]{--region-glow:rgba(71,102,64,.17);--region-glow2:rgba(91,79,46,.10)}
button,select,input{font:inherit}button{cursor:pointer}.app-shell{width:100%;max-width:860px;margin:auto;padding:22px 15px 48px;position:relative}
.center{text-align:center}.left{text-align:left}.site-header{text-align:center;padding:4px 0 8px}.site-header.compact{padding-bottom:2px}.sigil{font-size:23px;color:var(--gold);text-shadow:0 0 22px rgba(208,167,84,.38);margin-bottom:5px}.eyebrow,.micro,.label,.tag,.section-kicker,.who,.weapon-type,.fate-title,.scope{font:850 9px/1.2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.14em}.eyebrow,.tag,.section-kicker{color:var(--gold)}
h1{font-weight:400;font-size:clamp(34px,10vw,50px);line-height:.98;margin:7px 0}.site-header.compact h1{font-size:clamp(24px,7vw,35px);margin:5px 0}.header-dumb{font-size:11px;color:var(--ash);font-style:italic;margin-top:6px}.sub{color:var(--ash);font-size:14px;line-height:1.5;margin:3px auto 0;max-width:680px}.mode-pill{display:inline-block;margin-top:11px;padding:4px 8px;border-bottom:1px solid var(--line);font:750 9px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--ash)}
.menu-section{max-width:620px;margin:22px auto 0;padding:0 2px}.stack{display:grid;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu-title{font-size:26px;text-align:center;margin-bottom:2px}.label{display:block;color:var(--ash);margin-bottom:7px}select,input{width:100%;min-height:50px;border:0;border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,var(--paper) 12%,var(--paper) 88%,transparent);color:var(--ink);border-radius:0;padding:0 11px;font-size:16px;outline:none}select:focus,input:focus{border-bottom-color:var(--gold)}
.btn{width:100%;min-height:49px;border:1px solid var(--line);background:rgba(18,16,12,.55);color:var(--ink);padding:11px 13px;font:850 10px/1.2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.055em;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}.btn.gold{background:linear-gradient(180deg,#d3b36e,#b28d48);border-color:#d7ba78;color:#17120a;text-shadow:0 1px rgba(255,255,255,.2)}.btn.ghost{background:transparent}.btn.curse{border-color:rgba(201,102,90,.62);color:#e08b7f;background:rgba(86,25,20,.10)}.btn.text-btn{border:0;background:transparent;color:var(--ash);clip-path:none;text-transform:lowercase;letter-spacing:0}.btn.small{min-height:42px;font-size:9px}.btn:disabled{opacity:.45;cursor:not-allowed}.victory{min-height:59px;font-size:11px;letter-spacing:.08em}
.status{margin-top:14px;color:var(--ash);font:11px/1.45 system-ui,sans-serif;text-align:center}.status.warn{color:var(--red)}.join-banner{max-width:620px;margin:15px auto -4px;text-align:center;color:var(--gold);font:800 10px/1.4 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em}.join-banner strong{font-size:13px}
.ornament{display:flex;align-items:center;gap:9px;margin:18px 0;color:var(--gold);opacity:.78}.ornament:before,.ornament:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--line),transparent)}.ornament span{font-size:12px}.ornament.redline{color:var(--red)}.ornament.violetline{color:var(--violet)}.boss-ornament{margin-bottom:7px}
.region-header{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;padding:17px 0 12px;border-bottom:1px solid var(--line)}.micro{color:var(--ash)}.region{font-size:25px;line-height:1.05;margin-top:4px}.count{font:750 10px/1.3 system-ui,sans-serif;color:var(--ash);margin-top:7px;text-transform:uppercase;letter-spacing:.06em}.room-meta{text-align:right}.share-chip{border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--gold);padding:7px 0;font:850 11px/1 system-ui,sans-serif;letter-spacing:.09em}.share-chip span{color:var(--ash);font-size:8px;margin-right:7px}.fate-block{text-align:center;padding:13px 8px 2px}.progress-marks{display:flex;justify-content:center;gap:5px;margin-bottom:7px}.mark{font-size:12px;color:#464035}.mark.done{color:var(--gold);text-shadow:0 0 12px rgba(198,161,90,.35)}.mark.required:not(.done){color:#746747}.fate-title{color:var(--gold)}.fate-copy{font-size:10px;color:var(--ash);font-style:italic;margin-top:5px}.omen{text-align:center;color:var(--ash);font-size:11px;font-style:italic;padding-top:10px;min-height:27px}
.target{text-align:center;padding:11px 12px 6px;position:relative}.target.exit:before{content:"";position:absolute;inset:-10px 8%;background:radial-gradient(ellipse,rgba(198,161,90,.16),transparent 70%);filter:blur(4px);z-index:-1}.boss{font-size:clamp(30px,9vw,46px);line-height:1.02;margin:9px auto 7px;max-width:720px;text-wrap:balance}.flavor{font-size:12px;line-height:1.4;color:var(--ash);font-style:italic}.target.exit .tag{color:var(--gold-bright)}
.weapon-section{padding:0 2px}.section-kicker{text-align:center;margin-bottom:10px}.loadouts{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}.player{padding:16px 14px 15px;min-width:0}.player+ .player{border-left:1px solid var(--line)}.who{color:var(--ash)}.weapon{font-size:clamp(20px,5.5vw,29px);line-height:1.08;margin:7px 0 3px}.weapon-aside{font-size:10px;color:var(--ash);font-style:italic;margin-bottom:9px}.weapon-type{color:var(--gold);font-size:8px;margin-bottom:10px}.weapon-stats{margin:0}.weapon-stats>div{display:grid;grid-template-columns:58px 1fr;gap:6px;padding:3px 0}.weapon-stats dt{font:750 8px/1.3 system-ui,sans-serif;text-transform:uppercase;color:#776f60;letter-spacing:.08em}.weapon-stats dd{margin:0;font-size:11px;line-height:1.3;color:#c9c0af;overflow-wrap:anywhere}
.redtext{color:var(--red)}.violettext{color:var(--violet)}.curse-section{margin:20px 0 3px;padding:15px 15px;background:linear-gradient(90deg,transparent,rgba(91,28,23,.14) 13%,rgba(91,28,23,.14) 87%,transparent);border-top:1px solid rgba(201,102,90,.23);border-bottom:1px solid rgba(201,102,90,.23)}.curse-head{text-align:center;color:var(--red);font-size:13px;margin:6px 0 4px}.curse-glyphs{letter-spacing:3px;margin-right:7px}.penance-item{padding:12px 0;border-top:1px solid rgba(201,102,90,.18)}.scope{color:var(--red);font-size:8px}.penance-name{font-size:19px;margin:6px 0 5px}.penance-text{font-size:13px;line-height:1.42;color:#c8beac}.subtext{font-size:10px;color:var(--ash);font-style:italic;line-height:1.4;margin-top:7px}
.chaos-section{text-align:center;padding:1px 13px 4px}.chaos-caption{font-size:11px;color:var(--ash);margin-top:5px}.trigger{font-size:clamp(18px,5vw,24px);line-height:1.2;margin:8px auto 13px;max-width:680px}.seal-button{border:0;background:transparent;color:var(--red);display:grid;gap:6px;place-items:center;margin:0 auto;padding:5px 15px;font:850 9px/1.2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em}.seal{display:grid;place-items:center;width:55px;height:55px;border:1px solid var(--red);border-radius:50%;font-size:24px;font-family:Georgia,serif;box-shadow:0 0 0 4px rgba(201,102,90,.05),0 0 24px rgba(201,102,90,.12);transform:rotate(-7deg)}.chaos-reveal{max-width:660px;margin:12px auto 0;padding:14px 0;border-top:1px solid rgba(201,102,90,.35);border-bottom:1px solid rgba(201,102,90,.18);background:radial-gradient(ellipse,rgba(105,29,23,.18),transparent 70%)}.chaos-bad{font:850 9px/1 system-ui,sans-serif;color:var(--red);text-transform:uppercase;letter-spacing:.15em}.mutation{font-size:19px;line-height:1.3;color:#e18a7e;margin:8px auto;max-width:620px}.chaos-foot{font-size:10px;color:var(--ash);font-style:italic}
.weird-section{text-align:center;padding:1px 16px 4px;max-width:690px;margin:auto}.weird-name{font-size:clamp(21px,6vw,29px);margin:8px 0}.rtext{font-size:15px;line-height:1.45;color:#d2c9b8}.item-footer{font-size:10px;color:var(--ash);font-style:italic;margin-top:8px}.game-actions{max-width:720px;margin:auto}.utility{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.appeals{margin-top:25px;padding-top:16px;border-top:1px solid var(--line)}.appeal-copy{text-align:center;color:var(--ash);font-size:11px;margin:-2px 0 11px}.appeal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.confirm{margin:14px auto 0;max-width:700px;padding:16px 14px;background:linear-gradient(90deg,transparent,rgba(87,27,22,.14),transparent);border-top:1px solid rgba(201,102,90,.3);border-bottom:1px solid rgba(201,102,90,.3)}.confirm h3{text-align:center;font-size:22px;color:var(--red);font-weight:400;margin:7px 0}.confirm .rtext{font-size:13px;text-align:center}.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.restart-grid{margin-top:13px}
.history{margin-top:25px;padding-top:15px;border-top:1px solid var(--line)}.history-row{display:flex;justify-content:space-between;gap:10px;padding:8px 3px;border-bottom:1px solid var(--line-soft);font-size:12px;color:var(--ash)}.history-row strong{font-weight:400;color:var(--ink)}.empty-history{text-align:center;color:var(--ash);font-size:12px;font-style:italic;padding:8px}.run-options{margin-top:18px}.last-action{opacity:.75}.escape-screen{text-align:center;padding:27px 10px 14px}.escape-title{font-size:clamp(33px,9vw,47px);margin:10px 0 7px}.escape-copy{color:var(--ash);font-style:italic;font-size:13px}.toast{position:sticky;bottom:14px;margin:15px auto 0;max-width:560px;background:#15130f;border:1px solid var(--line);padding:11px;text-align:center;font:11px/1.4 system-ui,sans-serif;color:var(--ash);box-shadow:0 8px 30px rgba(0,0,0,.35)}
@media(max-width:570px){.app-shell{padding-left:13px;padding-right:13px}.region-header{align-items:flex-start}.region{font-size:21px}.room-meta{max-width:48%}.share-chip{font-size:10px}.weapon-stats>div{grid-template-columns:48px 1fr}.player{padding-left:9px;padding-right:9px}.appeal-grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.confirm-actions{grid-template-columns:1fr}.boss{font-size:34px}}
@media(max-width:370px){.weapon{font-size:18px}.weapon-stats dd{font-size:10px}.weapon-stats dt{font-size:7px}.player{padding-left:7px;padding-right:7px}.region-header{display:block}.room-meta{text-align:left;max-width:none;margin-top:9px}}

/* --- Screen-based Covenant UI --- */
.app-shell{max-width:760px;padding:16px 14px calc(86px + env(safe-area-inset-bottom))}
.site-header.compact{display:none}
.tc-screen{min-height:calc(100svh - 110px);animation:tcIn .22s ease-out}
@keyframes tcIn{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
.tc-topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 15px}
.tc-brand-small{font:800 8px/1 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.tc-sync{font:750 8px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ash)}
.tc-title{font-size:clamp(35px,10vw,49px);line-height:.92;text-align:center;font-weight:400;margin:16px auto 7px;max-width:450px}
.tc-subtitle{text-align:center;color:var(--gold);font:800 9px/1.2 system-ui,sans-serif;letter-spacing:.17em;text-transform:uppercase;margin-bottom:22px}
.tc-rune{width:104px;height:104px;border:1px solid rgba(198,161,90,.22);border-radius:50%;margin:-1px auto -72px;opacity:.55;position:relative;pointer-events:none;box-shadow:inset 0 0 30px rgba(198,161,90,.07),0 0 36px rgba(198,161,90,.05)}
.tc-rune:before,.tc-rune:after{content:"";position:absolute;inset:18px;border:1px solid rgba(198,161,90,.28);transform:rotate(45deg)}.tc-rune:after{inset:31px;border-radius:50%;transform:none}
.tc-panel{border:1px solid rgba(198,161,90,.18);background:linear-gradient(145deg,rgba(24,21,15,.84),rgba(10,9,7,.66));box-shadow:inset 0 1px rgba(255,255,255,.015);padding:14px;margin:10px 0}
.tc-panel.soft{border-color:var(--line-soft)}
.tc-kicker{font:800 8px/1.2 system-ui,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--ash);margin-bottom:6px}.tc-kicker.gold{color:var(--gold)}.tc-kicker.red{color:var(--red)}.tc-kicker.violet{color:var(--violet)}
.tc-value{font-size:22px;line-height:1.08}.tc-value.big{font-size:clamp(31px,8vw,43px)}
.tc-muted{color:var(--ash);font-size:11px;line-height:1.4}.tc-italic{font-style:italic}
.tc-hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tc-hub-grid .tc-panel:first-child{grid-column:1/-1}
.tc-progress-line{height:3px;background:#242018;margin:10px 0 5px;position:relative;overflow:hidden}.tc-progress-line>span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#85672f,var(--gold-bright));box-shadow:0 0 12px rgba(224,193,123,.25)}
.tc-code-row{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold);font:800 10px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;margin:17px 0 4px}.tc-code-row button{border:0;background:transparent;color:var(--gold);font:inherit;padding:6px}
.tc-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}.tc-quick button{min-height:83px;border:1px solid var(--line);background:rgba(11,10,8,.75);color:var(--ink);display:grid;place-items:center;align-content:center;gap:8px;font:800 8px/1.2 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}.tc-icon{font-size:25px;color:var(--gold);font-family:Georgia,serif}
.tc-bottom-nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);height:70px;padding:5px 10px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(180deg,rgba(8,8,6,.88),rgba(6,6,5,.98) 28%);border-top:1px solid #2c281f;backdrop-filter:blur(12px)}
.tc-bottom-nav button{border:0;background:transparent;color:#706858;display:grid;place-items:center;align-content:center;gap:4px;font:800 7px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.07em}.tc-bottom-nav button.active{color:var(--gold-bright)}.tc-bottom-nav .nicon{font:18px/1 Georgia,serif}
.tc-brief-head{text-align:center;padding:4px 10px 13px}.tc-brief-boss{font-size:clamp(34px,10vw,48px);line-height:.98;margin:8px 0 5px}.tc-brief-region{color:var(--ash);font-size:11px}
.tc-loadouts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:rgba(14,12,9,.58)}.tc-loadout{padding:13px;min-width:0}.tc-loadout+.tc-loadout{border-left:1px solid var(--line)}.tc-loadout-name{font-size:20px;line-height:1.05;margin:6px 0 8px}.tc-mini-stat{display:grid;grid-template-columns:48px 1fr;gap:5px;margin:3px 0;font-size:9px;color:#bbb19f}.tc-mini-stat b{font:800 7px/1.3 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#6f6759}
.tc-feature{padding:15px 14px;margin:10px 0;border:1px solid}.tc-feature.chaos{border-color:rgba(201,102,90,.38);background:radial-gradient(circle at 10% 50%,rgba(135,43,34,.20),transparent 45%),rgba(41,15,12,.26)}.tc-feature.rite{border-color:rgba(151,128,173,.35);background:radial-gradient(circle at 10% 50%,rgba(89,62,113,.20),transparent 45%),rgba(28,20,37,.34)}.tc-feature-title{font-size:19px;margin:6px 0 5px}.tc-feature-text{font-size:11px;color:#c9c0af;line-height:1.4}.tc-feature-row{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center}.tc-feature-glyph{font-size:27px;text-align:center}.chaos .tc-feature-glyph{color:var(--red)}.rite .tc-feature-glyph{color:var(--violet)}
.tc-seal-inline{border:0;background:transparent;color:var(--red);padding:8px 0 0;font:800 8px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em}.tc-actions-3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}.tc-actions-3 .btn{padding:8px 5px;font-size:8px}
.tc-penalty-summary{margin:9px 0;border-top:1px solid rgba(201,102,90,.24);padding-top:9px}.tc-penalty-summary summary{color:var(--red);cursor:pointer;font:800 8px/1.2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em}
.tc-ledger-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:8px 0 15px}.tc-ledger-count{font-size:34px;color:var(--gold-bright)}.tc-rem-grid{display:grid;grid-template-columns:1fr;gap:6px}.tc-rem{display:flex;justify-content:space-between;gap:12px;padding:10px 9px;border-bottom:1px solid var(--line-soft);font-size:11px}.tc-rem.done{color:#bfa96e}.tc-rem .stamp{font:800 8px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5f594e}.tc-rem.done .stamp{color:var(--gold)}

.tc-chaos-event{min-height:calc(100svh - 28px);display:grid;align-content:center;text-align:center;padding:22px 8px;position:relative;overflow:hidden}.tc-chaos-event:before{content:"";position:absolute;inset:-20%;background:repeating-conic-gradient(from 0deg,rgba(205,63,48,.13) 0deg 1deg,transparent 1deg 17deg);animation:chaosTurn 24s linear infinite;mask-image:radial-gradient(circle,#000 0 37%,transparent 72%);pointer-events:none}.tc-chaos-event:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 43%,rgba(172,40,28,.25),transparent 34%);pointer-events:none}@keyframes chaosTurn{to{transform:rotate(360deg)}}

/* --- Real image asset pass --- */
.tc-photo{background-size:cover;background-position:center 45%;background-repeat:no-repeat}
.tc-grace-art.tc-photo{min-height:170px;box-shadow:inset 0 -70px 70px rgba(5,4,3,.80),0 12px 34px rgba(0,0,0,.24)}
.tc-boss-art.tc-photo{min-height:155px;background-position:center 38%;filter:saturate(.88) contrast(1.03)}
.tc-path-photo{background-size:cover;background-position:center;background-repeat:no-repeat;transform:scale(1.01);transition:transform .22s ease,filter .22s ease}
.tc-path:active .tc-path-photo{transform:scale(1.035);filter:brightness(1.12)}
.tc-chaos-event{background-image:linear-gradient(rgba(8,2,2,.45),rgba(3,2,2,.72)),url('https://commons.wikimedia.org/wiki/Special:Redirect/file/RED_RUST_TEXTURE.jpg');background-size:cover;background-position:center}

/* --- Image + encounter-entry polish --- */
.tc-grace-art.tc-photo,
.tc-boss-art.tc-photo{
  width:100%;
  min-height:0 !important;
  height:auto !important;
  aspect-ratio:16/5;
  background-size:cover;
  background-repeat:no-repeat;
}
.tc-grace-art.tc-photo{background-position:center 50%;}
.tc-boss-art.tc-photo{background-position:center 44%;}
.tc-target-card{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  color:var(--ink);
  text-align:left;
  font:inherit;
  cursor:pointer;
  transition:filter .16s ease,transform .16s ease,border-color .16s ease;
}
.tc-target-card:active{transform:translateY(1px);filter:brightness(1.12)}
.tc-target-card .tc-target-enter{display:block;margin-top:8px;color:var(--gold);font-size:8px;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:520px){
  .tc-grace-art.tc-photo{aspect-ratio:16/6;}
  .tc-boss-art.tc-photo{aspect-ratio:16/5.7;background-position:center 42%;}

.tc-name-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc-name-grid input{width:100%;box-sizing:border-box;border:1px solid #4b402d;background:rgba(12,10,7,.82);color:var(--ink);padding:12px 11px;font:16px Georgia,serif;outline:none;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px)}

.tc-name-grid input::placeholder{color:#71695b;font-style:italic}
@media(max-width:430px){.tc-name-grid{grid-template-columns:1fr}}


/* --- Chaos reveal readability + motion polish --- */
.tc-chaos-event{
  isolation:isolate;
  min-height:calc(100svh - 28px);
  padding:34px 20px calc(34px + env(safe-area-inset-bottom));
  animation:tcChaosFadeIn .7s cubic-bezier(.22,.8,.24,1) both;
}
.tc-chaos-event:before{
  opacity:.42;
  animation:chaosTurn 42s linear infinite;
}
.tc-chaos-event:after{
  background:
    radial-gradient(circle at 50% 43%,rgba(172,40,28,.19),transparent 34%),
    linear-gradient(180deg,rgba(4,2,2,.16),rgba(4,2,2,.48));
}
.tc-chaos-title{
  animation:tcChaosRise .55s .18s cubic-bezier(.22,.8,.24,1) both;
  text-shadow:0 2px 14px #000;
}
.tc-chaos-seal{
  animation:tcChaosSealIn .8s .08s cubic-bezier(.2,.85,.25,1.08) both;
}
.tc-chaos-event-name{
  animation:tcChaosRise .62s .34s cubic-bezier(.22,.8,.24,1) both;
  line-height:1.02;
  max-width:620px;
  margin:14px auto 14px;
  text-wrap:balance;
  text-shadow:0 3px 22px rgba(0,0,0,.92),0 0 18px rgba(175,58,43,.14);
}
.tc-chaos-consequence{
  animation:tcChaosRise .65s .48s cubic-bezier(.22,.8,.24,1) both;
  max-width:560px;
  padding:16px 18px;
  border-top:1px solid rgba(224,122,104,.26);
  border-bottom:1px solid rgba(224,122,104,.18);
  background:linear-gradient(90deg,transparent,rgba(9,4,4,.72) 14%,rgba(9,4,4,.78) 86%,transparent);
  color:#f0dfd0;
  font-size:17px;
  line-height:1.52;
  letter-spacing:.005em;
  text-shadow:0 2px 8px #000;
}
.tc-chaos-quip{
  animation:tcChaosRise .55s .62s cubic-bezier(.22,.8,.24,1) both;
  color:#c89b8f;
  font-size:12px;
  line-height:1.45;
  text-shadow:0 2px 8px #000;
}
.tc-chaos-event .btn{
  animation:tcChaosRise .55s .73s cubic-bezier(.22,.8,.24,1) both;
  min-height:48px;
  font-size:10px;
}
@keyframes tcChaosFadeIn{
  from{opacity:0;background-color:#020101}
  to{opacity:1}
}
@keyframes tcChaosRise{
  from{opacity:0;transform:translateY(14px);filter:blur(2px)}
  to{opacity:1;transform:none;filter:none}
}
@keyframes tcChaosSealIn{
  0%{opacity:0;transform:scale(.82) rotate(-5deg);filter:blur(5px)}
  68%{opacity:1;transform:scale(1.025) rotate(.8deg);filter:none}
  100%{opacity:1;transform:scale(1) rotate(0);filter:none}
}
@media(max-width:480px){
  .tc-chaos-event{padding:26px 16px calc(28px + env(safe-area-inset-bottom))}
  .tc-chaos-event-name{font-size:clamp(33px,10vw,46px);margin-top:10px}
  .tc-chaos-consequence{font-size:16px;padding:14px 12px;line-height:1.48}
  .tc-chaos-seal{margin:18px auto 20px}
}
@media(prefers-reduced-motion:reduce){
  .tc-chaos-event,.tc-chaos-title,.tc-chaos-seal,.tc-chaos-event-name,.tc-chaos-consequence,.tc-chaos-quip,.tc-chaos-event .btn{animation:none!important}
  .tc-chaos-event:before{animation:none!important}
}

.tc-chaos-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid rgba(195,151,75,.2);padding:6px 4px 10px;font-family:Georgia,serif;color:#bfa36d;letter-spacing:.14em;text-transform:uppercase;font-size:10px}.tc-chaos-head strong{text-align:center;font-size:19px;font-weight:400;color:#e4d3af;letter-spacing:.18em}.tc-chaos-head .favor{text-align:right;font-size:8px;color:#c6a764}
.tc-chaos-crumb{font:9px/1.2 Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:#8e8069;padding:11px 5px 7px}.tc-chaos-crumb b{color:#b64a38;font-weight:400}
.tc-chaos-card{position:relative;margin:4px auto 0;max-width:610px;border:1px solid rgba(185,145,72,.34);padding:10px 14px 20px;background:linear-gradient(180deg,rgba(13,11,9,.5),rgba(5,5,5,.82));box-shadow:inset 0 0 38px rgba(0,0,0,.55),0 16px 50px rgba(0,0,0,.35)}
.tc-chaos-card:before,.tc-chaos-card:after{content:"";position:absolute;width:35px;height:35px;border-color:#8a6a37;opacity:.55}.tc-chaos-card:before{left:6px;top:6px;border-left:1px solid;border-top:1px solid}.tc-chaos-card:after{right:6px;bottom:6px;border-right:1px solid;border-bottom:1px solid}
.tc-chaos-art-wrap{position:relative;width:min(82vw,360px);aspect-ratio:1;margin:1px auto -9px;animation:chaosArtEnter 1.15s cubic-bezier(.16,.78,.2,1) both}.tc-chaos-art{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;mix-blend-mode:screen;filter:saturate(.82) contrast(1.05);mask-image:radial-gradient(circle,#000 55%,rgba(0,0,0,.8) 68%,transparent 73%)}
.tc-chaos-halo{position:absolute;inset:7%;border:1px solid rgba(203,77,43,.28);border-radius:50%;box-shadow:0 0 35px rgba(178,48,28,.2);animation:chaosHalo 8s linear infinite}.tc-chaos-halo:before{content:"";position:absolute;inset:10%;border:1px dashed rgba(207,160,73,.25);border-radius:50%;animation:chaosHalo 13s linear infinite reverse}
.tc-ember-field{position:absolute;inset:0;overflow:hidden;pointer-events:none}.tc-ember{position:absolute;bottom:-10%;width:2px;height:8px;border-radius:50%;background:#d35a2a;box-shadow:0 0 7px #db5725;opacity:0;animation:chaosEmber var(--dur) var(--delay) linear infinite;left:var(--x)}
.tc-chaos-title{font-family:Georgia,serif;font-size:clamp(30px,8.3vw,50px);font-weight:400;letter-spacing:.035em;text-align:center;text-transform:uppercase;color:#c8ac75;text-shadow:0 2px 18px #000;margin:0 0 13px;animation:chaosRevealText .7s .58s both}.tc-chaos-rule{height:1px;background:linear-gradient(90deg,transparent,#7a542d 20%,#ad4c2f 50%,#7a542d 80%,transparent);margin:0 auto 15px;width:80%}
.tc-chaos-label{text-align:center;color:#9d7745;font:8px/1.2 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;margin:7px 0}.tc-chaos-event-name{text-align:center;font:400 clamp(24px,7vw,38px)/1 Georgia,serif;letter-spacing:.055em;text-transform:uppercase;color:#eee7db;margin:8px auto 14px;max-width:540px;text-wrap:balance;animation:chaosRevealText .65s .78s both}
.tc-chaos-reading{position:relative;max-width:520px;margin:0 auto;padding:13px 15px 12px;border-top:1px solid rgba(164,120,62,.25);border-bottom:1px solid rgba(164,120,62,.18);background:linear-gradient(90deg,transparent,rgba(9,8,7,.8) 12%,rgba(9,8,7,.86) 88%,transparent);animation:chaosRevealText .65s .94s both}.tc-chaos-consequence{text-align:center;color:#ded3c0;font:400 16px/1.48 Georgia,serif;text-shadow:0 2px 9px #000}.tc-chaos-quip{text-align:center;color:#8f8799;font:italic 13px/1.4 Georgia,serif;margin:13px auto 15px;max-width:430px;animation:chaosRevealText .65s 1.08s both}
.tc-chaos-event .btn{display:block;width:min(520px,94%);margin:0 auto;min-height:53px;border:1px solid #8e5e31;color:#dfc28b;background:linear-gradient(180deg,rgba(104,27,18,.86),rgba(45,10,8,.96));font-family:Georgia,serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;clip-path:polygon(13px 0,calc(100% - 13px) 0,100% 13px,100% calc(100% - 13px),calc(100% - 13px) 100%,13px 100%,0 calc(100% - 13px),0 13px);box-shadow:inset 0 0 22px rgba(213,68,33,.11),0 6px 22px rgba(0,0,0,.3);animation:chaosRevealText .65s 1.2s both}
@keyframes chaosCurtain{from{opacity:0;background:#000}to{opacity:1}}@keyframes chaosRuneTurn{to{transform:rotate(360deg)}}@keyframes chaosHalo{to{transform:rotate(360deg)}}@keyframes chaosArtEnter{0%{opacity:0;transform:scale(.72);filter:blur(8px)}55%{opacity:1;transform:scale(1.035);filter:none}100%{transform:scale(1)}}@keyframes chaosRevealText{from{opacity:0;transform:translateY(11px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}@keyframes chaosEmber{0%{opacity:0;transform:translate3d(0,0,0) scale(.6)}12%{opacity:.7}100%{opacity:0;transform:translate3d(var(--drift),-105vh,0) scale(1.3)}}
@media(max-width:430px){.tc-chaos-event{padding-left:9px;padding-right:9px}.tc-chaos-card{padding-left:9px;padding-right:9px}.tc-chaos-art-wrap{width:min(84vw,330px)}.tc-chaos-consequence{font-size:15px}.tc-chaos-head strong{font-size:16px}}

/* --- CHAOS REVEAL III: one-screen compact layout --- */
.tc-chaos-event{
  box-sizing:border-box;
  height:calc(100svh - 70px);
  min-height:0;
  padding:7px 10px 9px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
.tc-chaos-event .tc-ember-field{position:fixed;inset:0 0 70px;z-index:-1}
.tc-chaos-head{
  flex:0 0 auto;
  grid-template-columns:1fr auto;
  padding:3px 3px 7px;
  min-height:29px;
}
.tc-chaos-head>span:first-child{display:none}
.tc-chaos-head strong{text-align:left;font-size:13px;letter-spacing:.18em}
.tc-chaos-head .favor{font-size:7px;line-height:1.15;max-width:110px}
.tc-chaos-crumb{display:none}
.tc-chaos-card{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  max-width:610px;
  margin:4px auto 0;
  padding:8px 11px 10px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
}
.tc-chaos-art-wrap{
  flex:0 0 auto;
  width:min(53vw,215px);
  height:min(47vw,190px);
  aspect-ratio:auto;
  margin:-2px auto 2px;
  border-radius:50%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,rgba(229,93,44,.33) 0 4%,transparent 5%),
    repeating-conic-gradient(from 0deg,rgba(205,145,66,.42) 0 1deg,transparent 1deg 30deg),
    radial-gradient(circle,transparent 0 29%,rgba(179,105,45,.55) 30% 31%,transparent 32% 45%,rgba(151,54,33,.5) 46% 47%,transparent 48% 61%,rgba(174,124,62,.27) 62% 63%,transparent 64%),
    radial-gradient(circle,#1a0d09 0 42%,#080605 66%,transparent 71%);
  box-shadow:inset 0 0 35px #000,0 0 32px rgba(164,47,26,.16);
  animation:chaosArtEnter .8s cubic-bezier(.16,.78,.2,1) both;
}
.tc-chaos-art-wrap:before,.tc-chaos-art-wrap:after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  pointer-events:none
}
.tc-chaos-art-wrap:before{
  width:50%;height:50%;border:2px solid rgba(203,118,56,.65);border-radius:50%;
  box-shadow:0 0 15px rgba(226,72,37,.36),inset 0 0 18px rgba(210,64,31,.22)
}
.tc-chaos-art-wrap:after{
  width:2px;height:72%;background:linear-gradient(transparent,#e05b32 24%,#f09055 50%,#e05b32 76%,transparent);
  box-shadow:0 0 9px #d84f2e;opacity:.75
}
.tc-chaos-art{width:100%;height:100%;object-fit:cover;border-radius:50%;position:relative;z-index:1}
.tc-chaos-halo{z-index:2;inset:3%}
.tc-chaos-title{
  flex:0 0 auto;
  font-size:clamp(25px,7vw,36px);
  line-height:.94;
  margin:1px 0 5px;
}
.tc-chaos-rule{margin:0 auto 7px;width:64%}
.tc-chaos-label{font-size:7px;margin:3px 0;letter-spacing:.21em}
.tc-chaos-event-name{
  flex:0 0 auto;
  font-size:clamp(20px,5.8vw,29px);
  line-height:1.02;
  margin:4px auto 7px;
}
.tc-chaos-reading{
  flex:0 0 auto;
  margin:0 auto;
  padding:7px 10px 8px;
  width:min(100%,520px);
}
.tc-chaos-consequence{font-size:clamp(13px,3.75vw,16px);line-height:1.3}
.tc-chaos-quip{
  flex:0 0 auto;
  font-size:11px;
  line-height:1.25;
  margin:7px auto 8px;
  max-height:30px;
  overflow:hidden;
}
.tc-chaos-event .btn{
  flex:0 0 auto;
  width:min(470px,94%);
  min-height:40px;
  height:40px;
  margin:0 auto;
  font-size:10px;
}
@media(max-height:760px){
  .tc-chaos-art-wrap{width:168px;height:148px}
  .tc-chaos-title{font-size:25px}
  .tc-chaos-event-name{font-size:20px}
  .tc-chaos-consequence{font-size:13px}
  .tc-chaos-quip{display:none}
}
@media(max-height:690px){
  .tc-chaos-art-wrap{width:132px;height:116px}
  .tc-chaos-title{font-size:22px}
  .tc-chaos-rule{margin-bottom:4px}
  .tc-chaos-event-name{font-size:18px;margin-bottom:4px}
  .tc-chaos-reading{padding:5px 8px 6px}
  .tc-chaos-event .btn{height:37px;min-height:37px}
}

/* --- Post-battle report: Favor bookkeeping belongs after the fight --- */
.tc-battle-report{min-height:calc(100svh - 24px);max-width:620px;margin:0 auto;padding:clamp(22px,5vh,48px) 14px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;text-align:center}
.tc-report-kicker{font:800 8px/1 system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
.tc-report-victory{font:400 clamp(34px,10vw,50px)/.9 Georgia,serif;letter-spacing:.08em;color:var(--gold-bright);text-shadow:0 0 28px rgba(224,193,123,.14)}
.tc-report-boss{font:400 clamp(22px,6.7vw,32px)/1.05 Georgia,serif;color:var(--ink);margin:10px auto 13px;text-wrap:balance}
.tc-report-rule{height:1px;width:70%;margin:0 auto 12px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.tc-report-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line-soft)}
.tc-report-row.muted{opacity:.66}.tc-report-copy{min-width:0}.tc-report-detail{font:11px/1.35 Georgia,serif;color:#c9c0af;margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tc-report-choices{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);min-width:116px}.tc-report-choices button{min-height:38px;padding:0 10px;border:0;background:transparent;color:var(--ash);font:800 8px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em}.tc-report-choices button+button{border-left:1px solid var(--line)}
.tc-report-choices button.active.yes{background:rgba(198,161,90,.18);color:var(--gold-bright)}.tc-report-choices button.active.no{background:rgba(201,102,90,.12);color:#d58b80}
.tc-report-stamp{font:800 8px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--ash)}
.tc-report-total{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:15px 0 10px;padding:10px 4px;border-top:1px solid rgba(198,161,90,.22);color:var(--ash);font:800 8px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.09em}.tc-report-total strong{font:400 27px/1 Georgia,serif;color:var(--gold-bright)}
.tc-battle-report .btn{min-height:50px}.tc-report-note{font:10px/1.35 Georgia,serif;font-style:italic;color:var(--ash);margin-top:8px}
@media(max-height:700px){.tc-battle-report{padding-top:14px;padding-bottom:14px}.tc-report-row{padding:9px 3px}.tc-report-detail{-webkit-line-clamp:2}.tc-report-boss{margin:7px auto 9px}.tc-report-total{margin:10px 0 8px}}


/* --- Ledger Compendium: the stupid things we survived --- */
.tc-ledger-tabs-3{grid-template-columns:repeat(3,1fr)}
.tc-comp-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;padding:8px 3px 15px;border-bottom:1px solid rgba(198,161,90,.24)}
.tc-comp-title{font:400 clamp(24px,7vw,34px)/1.02 Georgia,serif;margin:5px 0 6px;color:var(--ink)}
.tc-comp-total{font:400 48px/.9 Georgia,serif;color:var(--gold-bright);opacity:.9}
.tc-comp-stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-soft);margin:11px 0 15px;background:rgba(12,11,8,.55)}
.tc-comp-stats>div{text-align:center;padding:10px 4px;border-right:1px solid var(--line-soft)}.tc-comp-stats>div:last-child{border-right:0}
.tc-comp-stats strong{display:block;font:400 20px/1 Georgia,serif;color:var(--gold-bright)}.tc-comp-stats span{display:block;margin-top:4px;font:800 6px/1.2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--ash)}
.tc-comp-list{display:grid;gap:8px}.tc-comp-card{border:1px solid var(--line-soft);background:linear-gradient(145deg,rgba(22,19,14,.78),rgba(8,8,6,.72));overflow:hidden}.tc-comp-card.capstone{border-color:rgba(198,161,90,.37)}
.tc-comp-card summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 12px}.tc-comp-card summary::-webkit-details-marker{display:none}
.tc-comp-number{font:800 7px/1.2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.11em;color:var(--ash)}.tc-comp-boss{font:400 clamp(20px,6vw,27px)/1.05 Georgia,serif;margin:5px 0 3px;color:var(--ink)}.tc-comp-pair{font:italic 10px/1.25 Georgia,serif;color:#aaa18f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-comp-mark{font:800 7px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);border-left:1px solid var(--line);padding-left:10px}.tc-comp-card[open] .tc-comp-mark{color:var(--gold-bright)}
.tc-comp-body{border-top:1px solid var(--line-soft);padding:11px 12px 12px;background:rgba(5,5,4,.26)}
.tc-comp-weapons{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-soft);margin-bottom:9px}.tc-comp-weapons>div{padding:9px;min-width:0}.tc-comp-weapons>div+div{border-left:1px solid var(--line-soft)}.tc-comp-weapons span,.tc-comp-mod>span{display:block;font:800 7px/1.2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--ash)}.tc-comp-weapons strong{display:block;font:400 15px/1.1 Georgia,serif;margin:4px 0}.tc-comp-weapons em{display:block;color:#8f8675;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-comp-mod{padding:9px 1px;border-top:1px solid var(--line-soft)}.tc-comp-mod strong{display:block;font:400 15px/1.2 Georgia,serif;margin:4px 0;color:var(--ink)}.tc-comp-mod p{margin:4px 0 0;font:10px/1.35 Georgia,serif;color:#bbb19f}.tc-comp-mod.rite>span{color:var(--violet)}.tc-comp-mod.chaos>span{color:var(--red)}.tc-comp-mod.quiet{opacity:.62}.tc-comp-mod.penalties>span{color:#d58b80}.tc-comp-mod.penalties b{font-weight:400;color:#d6c8b0}
.tc-comp-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line-soft);padding-top:9px;margin-top:2px;font:800 7px/1.2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--ash)}.tc-comp-footer strong{color:var(--gold)}
.tc-comp-legacy{padding:0 12px 13px;color:var(--ash);font:italic 10px/1.4 Georgia,serif}.tc-comp-card.legacy{opacity:.77}
.tc-comp-empty{text-align:center;padding:20vh 20px 0}.tc-comp-empty-glyph{font-size:38px;color:var(--gold);margin-bottom:12px;opacity:.7}
@media(max-width:390px){.tc-comp-stats{grid-template-columns:repeat(2,1fr)}.tc-comp-stats>div:nth-child(2){border-right:0}.tc-comp-stats>div:nth-child(-n+2){border-bottom:1px solid var(--line-soft)}.tc-comp-weapons{grid-template-columns:1fr}.tc-comp-weapons>div+div{border-left:0;border-top:1px solid var(--line-soft)}}

// Spreadsheet-backed regional pools.
const ORIGINAL_WEAPON_CATALOG = new Map();
for (const region of Object.values(regions)) {
  for (const weapon of (region.weapons || [])) {
    const key = weapon.name.replace(/ \(\+\d+\)$/,'').toLowerCase().replace(/[’]/g,"'");
    if (!ORIGINAL_WEAPON_CATALOG.has(key)) ORIGINAL_WEAPON_CATALOG.set(key, weapon);
  }
}

function sheetWeapon(name) {
  const lookup = name.replace(/ \(\+\d+\)$/,'').toLowerCase().replace(/[’]/g,"'");
  const known = ORIGINAL_WEAPON_CATALOG.get(lookup);
  if (known) return { ...known, name };
  return W(name, 'Regional weapon', 'Smithing path varies', 'Native skill', false);
}

for (const [regionName, names] of Object.entries(SHEET_WEAPON_POOLS)) {
  if (regions[regionName]) regions[regionName].weapons = names.map(sheetWeapon);
}
for (const [regionName, names] of Object.entries(SHEET_BOSS_POOLS)) {
  if (regions[regionName]) regions[regionName].bosses = [...names];
}

function normalizedGameName(name = '') {
  return name.toLowerCase().replace(/[’]/g,"'");
}

function weaponBlockedByTarget(weapon, target) {
  if (weapon.requires && normalizedGameName(target.name).includes(normalizedGameName(weapon.requires))) return true;
  const block = WEAPON_TARGET_BLOCKS[normalizedGameName(weapon.name).replace(/ \(\+\d+\)$/,'')];
  return Boolean(block && normalizedGameName(target.name).includes(block));
}

  'Scadutree Avatar': 'Scadu Altus + Shadow Keep · DLC',
  'Metyr, Mother of Fingers': 'Scadu Altus + Shadow Keep · DLC',
  'Midra, Lord of Frenzied Flame': 'Abyssal Woods · DLC',
  'Messmer the Impaler': 'Scadu Altus + Shadow Keep · DLC',
  'Romina, Saint of the Bud': 'Ancient Ruins of Rauh · DLC',
  'Promised Consort Radahn': 'Enir-Ilim · DLC'
};

function collectedRemembrances(state) {
  return new Set((state.history || []).map(x => x.name));
}

function requiredRemembrances(state) {
  return state.includeDlc ? [...BASE_REMEMBRANCES, ...DLC_REMEMBRANCES] : [...BASE_REMEMBRANCES];
}

function missingRemembrances(state) {
  const collected = collectedRemembrances(state);
  return requiredRemembrances(state).filter(name => !collected.has(name));
}

function finalSealOpen(state) {
  return missingRemembrances(state).length === 0;
}

function hasRemembrance(state, name) {
  return collectedRemembrances(state).has(name);
}

function regionHasMissingRemembrance(state, regionName) {
  return missingRemembrances(state).some(name => REMEMBRANCE_REGION[name] === regionName);
}

function regionUnlocked(state, regionName) {
  const cleared = new Set(state.clearedRegions || []);
  const has = name => hasRemembrance(state, name);
  switch (regionName) {
    case 'Weeping Peninsula':
    case 'Liurnia of the Lakes':
    case 'Caelid':
      return cleared.has('Limgrave + Stormveil');
    case 'Siofra River + Nokron':
      return has('Starscourge Radahn');
    case 'Lake of Rot + Grand Cloister':
      return has('Regal Ancestor Spirit') && has('Rennala, Queen of the Full Moon');
    case 'Altus Plateau + Leyndell':
      return has('Rennala, Queen of the Full Moon');
    case 'Mt. Gelmir':
      return cleared.has('Altus Plateau + Leyndell');
    case 'Deeproot Depths':
      return has('Regal Ancestor Spirit');
    case 'Mountaintops of the Giants':
      return has('Morgott, the Omen King');
    case 'Mohgwyn Palace':
      return has('Starscourge Radahn') && cleared.has('Mountaintops of the Giants');
    case 'Miquella’s Haligtree':
      return cleared.has('Mountaintops of the Giants');
    case 'Crumbling Farum Azula':
      return has('Fire Giant');
    case 'Leyndell, Ashen Capital':
      return has('Maliketh, the Black Blade');
    case 'The Erdtree':
      return has('Godfrey, First Elden Lord / Hoarah Loux') && finalSealOpen(state);
    case 'Gravesite Plain · DLC':
      return Boolean(state.includeDlc) && has('Starscourge Radahn') && has('Mohg, Lord of Blood');
    case 'Cerulean Coast · DLC':
    case 'Dragon’s Pit + Jagged Peak · DLC':
    case 'Scadu Altus + Shadow Keep · DLC':
      return Boolean(state.includeDlc) && cleared.has('Gravesite Plain · DLC');
    case 'Abyssal Woods · DLC':
      return Boolean(state.includeDlc) && cleared.has('Scadu Altus + Shadow Keep · DLC');
    case 'Ancient Ruins of Rauh · DLC':
      return Boolean(state.includeDlc) && has('Messmer the Impaler');
    case 'Enir-Ilim · DLC':
      return Boolean(state.includeDlc) && has('Messmer the Impaler') && has('Romina, Saint of the Bud');
    default:
      return regionName === 'Limgrave + Stormveil';
  }
}

function availableNextRegions(state) {
  const cleared = new Set(state.clearedRegions || []);
  return Object.keys(regions).filter(regionName => {
    if (regionName === state.region) return false;
    if (!state.includeDlc && regionName.includes('· DLC')) return false;
    if (!regionUnlocked(state, regionName)) return false;
    if (!cleared.has(regionName)) return true;
    return regionHasMissingRemembrance(state, regionName);
  });
}

function remembranceLedgerMarkup(state) {
  const required = requiredRemembrances(state);
  const collected = collectedRemembrances(state);
  const done = required.filter(name => collected.has(name)).length;
  const missing = required.filter(name => !collected.has(name));
  return `<section class="fate-block">
    <div class="fate-title">REMEMBRANCES · ${done}/${required.length}</div>
    <div class="fate-copy">${missing.length ? `${missing.length} required before the final seal can break.` : 'all required Remembrances claimed · the final seal is open.'}</div>
  </section>`;
}

function defeatedBossNames(state, regionName = state.region) {
  return new Set((state.history || [])
    .filter(entry => entry?.region === regionName)
    .map(entry => entry.name));
}

function availableRegionalBosses(state) {
  const defeated = defeatedBossNames(state);
  return (regions[state.region].bosses || []).filter(name => !defeated.has(name));
}

function capstoneRequirement(state) {
  if (state.region === 'The Erdtree') return 0;
  const available = availableRegionalBosses(state);
  const poolAtEntry = state.cleared + available.length;
  return Math.min(MIN_REGIONAL_BOSSES, poolAtEntry);
}

function capstoneChanceForState(state) {
  const requirement = capstoneRequirement(state);
  if (state.cleared < requirement) return 0;
  return Math.min(0.10 + Math.max(0, state.cleared - requirement) * 0.09, 0.82);
}

function chooseTarget(state) {
  const region = regions[state.region];
  if (state.region === 'The Erdtree') return { name: region.exit, exit: true };

  const available = availableRegionalBosses(state);
  const revisiting = (state.clearedRegions || []).includes(state.region);
  if (revisiting && available.length) return { name: pick(available), exit: false };

  const requirement = capstoneRequirement(state);
  if (!available.length) return { name: region.exit, exit: true };
  if (state.cleared < requirement) return { name: pick(available), exit: false };
  return Math.random() < capstoneChanceForState(state)
    ? { name: region.exit, exit: true }
    : { name: pick(available), exit: false };
}

function eligibleWeapons(regionName, target) {
  const region = regions[regionName];
  const pool = (region.weapons || []).filter(w => !weaponBlockedByTarget(w, target));
  return pool.length ? pool : (region.weapons || []);
}

function buildFromWeapon(weapon) {
  return {
    ...weapon,
    affinity: weapon.infusable ? pick(affinities) : 'Fixed / unique',
    role: pick(roles)
  };
}

function recentWeaponNames(state, key, limit = 3) {
  return (state.history || [])
    .map(entry => entry?.[key])
    .filter(Boolean)
    .slice(0, limit);
}

function pairKey(a, b) {
  return [a, b].sort().join(' || ');
}

function usedWeaponNames(state) {
  const used = new Set();
  for (const entry of (state.history || [])) {
    if (entry.chaseWeapon) used.add(entry.chaseWeapon);
    if (entry.morganWeapon) used.add(entry.morganWeapon);
  }
  return used;
}

function accumulatedWeaponPool(state, target) {
  const regionNames = Array.from(new Set([...(state.clearedRegions || []), state.region]));
  const byName = new Map();
  for (const regionName of regionNames) {
    for (const weapon of eligibleWeapons(regionName, target)) {
      if (!byName.has(weapon.name)) byName.set(weapon.name, weapon);
    }
  }
  return [...byName.values()];
}

function scoreWeaponPair(state, chaseWeapon, morganWeapon, poolSize) {
  const chaseRecent = new Set(recentWeaponNames(state, 'chaseWeapon'));
  const morganRecent = new Set(recentWeaponNames(state, 'morganWeapon'));
  const recentPairs = new Set((state.history || [])
    .map(entry => entry?.weaponPair)
    .filter(Boolean)
    .slice(0, Math.min(10, Math.max(4, poolSize * 2))));
  let score = Math.random();
  if (!chaseRecent.has(chaseWeapon.name)) score += 5;
  if (!morganRecent.has(morganWeapon.name)) score += 5;
  if (!recentPairs.has(pairKey(chaseWeapon.name, morganWeapon.name))) score += 8;
  return score;
}

function bestPairFromPool(state, chasePool, morganPool) {
  const candidates = [];
  const poolSize = Math.max(chasePool.length, morganPool.length);
  for (const chaseWeapon of chasePool) {
    for (const morganWeapon of morganPool) {
      if (chaseWeapon.name === morganWeapon.name) continue;
      candidates.push({
        chaseWeapon,
        morganWeapon,
        score: scoreWeaponPair(state, chaseWeapon, morganWeapon, poolSize)
      });
    }
  }
  if (!candidates.length) return null;
  candidates.sort((a,b) => b.score - a.score);
  return candidates[0];
}

function chooseWeaponPair(state, target) {
  const currentPool = eligibleWeapons(state.region, target);
  const used = usedWeaponNames(state);
  const unusedCurrent = currentPool.filter(w => !used.has(w.name));
  let pair = null;

  // Burn through the current region's deck before recycling older areas.
  if (unusedCurrent.length >= 2) {
    pair = bestPairFromPool(state, unusedCurrent, unusedCurrent);
  } else if (unusedCurrent.length === 1) {
    const fallback = accumulatedWeaponPool(state, target).filter(w => w.name !== unusedCurrent[0].name);
    if (Math.random() < 0.5) pair = bestPairFromPool(state, unusedCurrent, fallback);
    else pair = bestPairFromPool(state, fallback, unusedCurrent);
  }

  if (!pair) {
    const fallback = accumulatedWeaponPool(state, target);
    pair = bestPairFromPool(state, fallback, fallback);
  }

  if (!pair) {
    const only = currentPool[0] || accumulatedWeaponPool(state, target)[0];
    return { chase: buildFromWeapon(only), morgan: buildFromWeapon(only) };
  }

  return {
    chase: buildFromWeapon(pair.chaseWeapon),
    morgan: buildFromWeapon(pair.morganWeapon)
  };
}

function makeBuild(regionName, target, avoidNames = [], state = null) {
  const avoided = new Set(Array.isArray(avoidNames) ? avoidNames : [avoidNames]);
  let pool = eligibleWeapons(regionName, target).filter(w => !avoided.has(w.name));
  if (state) {
    const unused = pool.filter(w => !usedWeaponNames(state).has(w.name));
    if (unused.length) pool = unused;
    else pool = accumulatedWeaponPool(state, target).filter(w => !avoided.has(w.name));
  }
  if (!pool.length) pool = eligibleWeapons(regionName, target);
  return buildFromWeapon(pick(pool));
}

function newEncounter(state) {
  const target = chooseTarget(state);
  const pair = chooseWeaponPair(state, target);
  const weird = pick(weirdness);
  return {
    id: crypto.randomUUID(),
    target,
    chase: pair.chase,
    morgan: pair.morgan,
    chaosTrigger: pick(chaosTriggers),
    chaosTriggered: false,
    chaosConsequence: '',
    weirdness: { name: weird[0], text: weird[1], ...riteMeta(weird) },
    flavor: pick(encounterFlavors),
    penances: [],
    createdAt: new Date().toISOString()
  };
}

function initialRunState({ region, severity, includeDlc = false, playerNames = ['Tarnished One','Tarnished Two'], createdBy = 'Chase' }) {
  const base = {
    version: 2,
    phase: 'active',
    region,
    severity,
    includeDlc,
    playerNames: Array.isArray(playerNames) && playerNames.length >= 2 ? playerNames.slice(0,2) : ['Tarnished One','Tarnished Two'],
    createdBy,
    cleared: 0,
    clearedRegions: [],
    history: [],
    current: null,
    regionComplete: false,
    runComplete: false,
    lastAction: `${createdBy} started the Covenant.`,
    updatedAt: new Date().toISOString()
  };
  base.current = newEncounter(base);
  return base;
}

function completeEncounter(state, actor) {
  const next = structuredClone(state);
  const target = next.current.target;
  const encounter = next.current;
  const riteFavor = encounter?.smithingRiteFavor ? Math.max(0, Number(encounter?.weirdness?.favor ?? 1)) : 0;
  const chaosFavor = encounter?.smithingChaosFavor ? Math.max(0, Number(encounter?.chaosFavor ?? 1)) : 0;
  next.history.unshift({
    name: target.name,
    exit: target.exit,
    region: next.region,
    completedBy: actor,
    completedAt: new Date().toISOString(),
    playerNames: structuredClone(next.playerNames || {}),
    chaseWeapon: encounter?.chase?.name || '',
    morganWeapon: encounter?.morgan?.name || '',
    chaseBuild: encounter?.chase ? structuredClone(encounter.chase) : null,
    morganBuild: encounter?.morgan ? structuredClone(encounter.morgan) : null,
    oddRite: encounter?.weirdness ? structuredClone(encounter.weirdness) : null,
    chaosTrigger: encounter?.chaosTrigger || '',
    chaosTriggered: Boolean(encounter?.chaosTriggered),
    chaosConsequence: encounter?.chaosConsequence || '',
    penances: structuredClone(encounter?.penances || []),
    favorEarned: riteFavor + chaosFavor
  });
  next.cleared += 1;
  next.lastAction = `${actor} says ${target.name} is defeated.`;
  next.updatedAt = new Date().toISOString();

  if (target.exit) {
    next.clearedRegions = Array.from(new Set([...(next.clearedRegions || []), next.region]));
    next.regionComplete = true;
    next.current = null;
    if (target.name === 'Radagon of the Golden Order / Elden Beast') next.runComplete = true;
    return next;
  }

  // If this is a return trip, leave automatically once its outstanding Remembrances are done.
  if ((next.clearedRegions || []).includes(next.region) && !regionHasMissingRemembrance(next, next.region)) {
    next.regionComplete = true;
    next.current = null;
    return next;
  }

  next.current = newEncounter(next);
  return next;
}

function rerollChaos(state, actor) {
  const next = structuredClone(state);
  next.current.chaosTrigger = pick(chaosTriggers);
  next.current.chaosTriggered = false;
  next.current.chaosConsequence = '';
  next.lastAction = `${actor} rerolled Chaos.`;
  next.updatedAt = new Date().toISOString();
  return next;
}

function rerollWeirdness(state, actor) {
  const next = structuredClone(state);
  const weird = pick(weirdness);
  next.current.weirdness = { name: weird[0], text: weird[1], ...riteMeta(weird) };
  next.lastAction = `${actor} rerolled the Odd Rite.`;
  next.updatedAt = new Date().toISOString();
  return next;
}

function targetScope() {
  const n = Math.random();
  if (n < 0.34) return { label: 'CHASE', text: 'Chase' };
  if (n < 0.68) return { label: 'MORGAN', text: 'Morgan' };
  return { label: 'BOTH', text: 'Chase and Morgan' };
}

function makePenance(targetName) {
  const def = pick(penaltyDefs);
  const scope = targetScope();
  return {
    id: crypto.randomUUID(),
    name: def[0],
    scope: scope.label,
    text: def[1](scope.text, targetName)
  };
}

function changeWeapons(state, actor, which) {
  const next = structuredClone(state);
  const current = next.current;
  if (which === 'chase') {
    current.chase = makeBuild(next.region, current.target, [current.morgan.name, current.chase.name], next);
  } else if (which === 'morgan') {
    current.morgan = makeBuild(next.region, current.target, [current.chase.name, current.morgan.name], next);
  } else {
    current.chase = makeBuild(next.region, current.target, [], next);
    current.morgan = makeBuild(next.region, current.target, [current.chase.name, current.morgan.name], next);
  }
  current.penances.push(makePenance(current.target.name));
  const names = Array.isArray(next.playerNames) && next.playerNames.length >= 2 ? next.playerNames : ['Tarnished One','Tarnished Two'];
  const label = which === 'both' ? 'both weapons' : `${which === 'chase' ? names[0] : names[1]}’s weapon`;
  next.lastAction = `${actor} changed ${label}; a penalty was added.`;
  next.updatedAt = new Date().toISOString();
  return next;
}

const SESSION_KEY = 'tarnished-covenant-session-v1';
const LOCAL_RUN_KEY = 'tarnished-covenant-local-run-v1';

const SESSION_COOKIE = 'tarnished_covenant_session_v1';

function sessionCookiePath() {
  const path = location.pathname || '/';
  return path.endsWith('/') ? path : path.slice(0, path.lastIndexOf('/') + 1);
}

function loadSession() {
  try {
    const local = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (local?.runId) return local;
  } catch {}
  try {
    const prefix = `${SESSION_COOKIE}=`;
    const raw = document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith(prefix));
    if (!raw) return null;
    const restored = JSON.parse(decodeURIComponent(raw.slice(prefix.length)));
    if (restored?.runId) {
      try { localStorage.setItem(SESSION_KEY, JSON.stringify(restored)); } catch {}
      return restored;
    }
  } catch {}
  return null;
}

function persistSessionCookie(value) {
  try {
    document.cookie = `${SESSION_COOKIE}=${encodeURIComponent(JSON.stringify(value))}; Max-Age=31536000; Path=${sessionCookiePath()}; SameSite=Lax; Secure`;
  } catch {}
}

function rememberSharedRunUrl(value) {
  if (!value?.joinCode || location.protocol === 'file:') return;
  try {
    const url = new URL(location.href);
    url.searchParams.set('join', value.joinCode);
    history.replaceState({}, '', `${url.pathname}${url.search}${url.hash}`);
  } catch {}
}

function saveSession(value) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(value)); } catch {}
  persistSessionCookie(value);
  rememberSharedRunUrl(value);
}

function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch {}
  try { document.cookie = `${SESSION_COOKIE}=; Max-Age=0; Path=${sessionCookiePath()}; SameSite=Lax; Secure`; } catch {}
}

function loadLocalRun() {
  try { return JSON.parse(localStorage.getItem(LOCAL_RUN_KEY) || 'null'); }
  catch { return null; }
}

function saveLocalRun(run) {
  localStorage.setItem(LOCAL_RUN_KEY, JSON.stringify(run));
}

function clearLocalRun() {
  localStorage.removeItem(LOCAL_RUN_KEY);
}
function randomCode() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 6; i++) out += alphabet[Math.floor(Math.random() * alphabet.length)];
  return out;
}

async function createBackend(config = {}) {
  const online = Boolean(config.SUPABASE_URL && config.SUPABASE_ANON_KEY);
  if (!online) return createLocalBackend();

  try {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    const supabase = createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
    let { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      const result = await supabase.auth.signInAnonymously();
      if (result.error) throw result.error;
      session = result.data.session;
    }
    return createSupabaseBackend(supabase);
  } catch (error) {
    console.warn('Supabase unavailable; falling back to local mode.', error);
    return createLocalBackend('Cloud sync unavailable; using local save.');
  }
}

function createLocalBackend(warning = '') {
  let listener = null;
  return {
    mode: 'local',
    warning,
    async createRun(displayName, state) {
      const run = { id: crypto.randomUUID(), joinCode: randomCode(), state, revision: 0, displayName };
      saveLocalRun(run);
      return run;
    },
    async joinRun() { throw new Error('Shared rooms are not connected yet. Add Supabase settings to config.js.'); },
    async getRun() { return loadLocalRun(); },
    async restartRun(runId, state) {
      const current = loadLocalRun();
      const revision = (current?.revision ?? 0) + 1;
      const run = { ...(current || {}), id: runId, state, revision };
      saveLocalRun(run);
      if (listener) queueMicrotask(() => listener(run));
      return run;
    },
    async updateRun(runId, expectedRevision, state) {
      const current = loadLocalRun();
      const revision = (current?.revision ?? expectedRevision) + 1;
      const run = { ...(current || {}), id: runId, state, revision };
      saveLocalRun(run);
      if (listener) queueMicrotask(() => listener(run));
      return { success: true, ...run };
    },
    subscribe(_runId, fn) { listener = fn; return () => { listener = null; }; }
  };
}

function createSupabaseBackend(supabase) {
  let channel = null;
  return {
    mode: 'shared',
    warning: '',
    async createRun(displayName, state) {
      const { data, error } = await supabase.rpc('create_covenant_run', {
        p_display_name: displayName,
        p_initial_state: state
      });
      if (error) throw error;
      const row = Array.isArray(data) ? data[0] : data;
      return normalizeRun(row);
    },
    async joinRun(joinCode, displayName) {
      const { data, error } = await supabase.rpc('join_covenant_run', {
        p_join_code: joinCode.trim().toUpperCase(),
        p_display_name: displayName
      });
      if (error) throw error;
      const row = Array.isArray(data) ? data[0] : data;
      return normalizeRun(row);
    },
    async getRun(runId) {
      const { data, error } = await supabase.from('runs')
        .select('id, join_code, state, revision')
        .eq('id', runId)
        .single();
      if (error) throw error;
      return normalizeRun(data);
    },
    async updateRun(runId, expectedRevision, state) {
      const { data, error } = await supabase.rpc('update_covenant_state', {
        p_run_id: runId,
        p_expected_revision: expectedRevision,
        p_new_state: state
      });
      if (error) throw error;
      const row = Array.isArray(data) ? data[0] : data;
      return {
        success: Boolean(row.success),
        id: runId,
        state: row.state,
        revision: Number(row.revision)
      };
    },
    async restartRun(runId, state) {
      const { data, error } = await supabase.rpc('restart_covenant_run', {
        p_run_id: runId,
        p_new_state: state
      });
      if (error) throw error;
      const row = Array.isArray(data) ? data[0] : data;
      return { id: runId, state: row.state, revision: Number(row.revision) };
    },
    subscribe(runId, fn) {
      if (channel) supabase.removeChannel(channel);
      channel = supabase.channel(`covenant-${runId}`)
        .on('postgres_changes', {
          event: 'UPDATE', schema: 'public', table: 'runs', filter: `id=eq.${runId}`
        }, payload => fn(normalizeRun(payload.new)))
        .subscribe();
      return () => {
        if (channel) supabase.removeChannel(channel);
        channel = null;
      };
    }
  };
}

function normalizeRun(row) {
  return {
    id: row.id || row.run_id,
    joinCode: row.join_code,
    state: row.state,
    revision: Number(row.revision || 0)
  };
}

      setToast(error.message || 'Could not create Covenant.');
    }
  });
}

async function joinSharedRun(code, identity) {
  try {
    const joined = await backend.joinRun(code, identity);
    run = joined;
    session = { runId: run.id, joinCode: run.joinCode, displayName: identity };
    saveSession(session);
    subscribe();
    rememberSharedRunUrl(session);
    renderRun();
  } catch (error) {
    console.error(error);
    setToast(error.message || 'Could not join that Covenant.');
  }
}

function subscribe() {
  unsubscribe?.();
  unsubscribe = backend.subscribe(run.id, incoming => {
    if (!incoming?.state) return;
    if (incoming.revision >= run.revision) {
      run = { ...run, ...incoming };
      renderRun();
    }
  });
}

async function commit(nextState, { retryBuilder = null, successToast = '' } = {}) {
  if (pending) {
    setToast('One action is still saving.');
    return false;
  }
  pending = true;
  try {
    let desiredState = nextState;
    let expectedRevision = run.revision;

    for (let attempt = 0; attempt < 2; attempt += 1) {
      const result = await backend.updateRun(run.id, expectedRevision, desiredState);
      if (result.success) {
        run = { ...run, state: result.state, revision: result.revision };
        renderRun();
        if (successToast) setToast(successToast);
        return true;
      }

      run = { ...run, state: result.state, revision: result.revision };
      if (!retryBuilder) {
        renderRun();
        setToast('The run changed on the other phone. Try again.');
        return false;
      }

      expectedRevision = run.revision;
      desiredState = retryBuilder(run.state);
    }

    renderRun();
    setToast('Restart could not complete. Try again.');
    return false;
  } catch (error) {
    console.error(error);
    setToast('Save failed. Try again.');
    return false;
  } finally {
    pending = false;
  }
}

function progressMarks(state) {
  const required = capstoneRequirement(state);
  const count = Math.max(4, Math.min(10, Math.max(required + 4, state.cleared + 3)));
  return Array.from({length:count},(_,i)=>`<span class="mark ${i < state.cleared ? 'done' : ''} ${i < required ? 'required' : ''}">${i < state.cleared ? '◆' : '◇'}</span>`).join('');
}

function capstoneBlock(state) {
  if (state.region === 'The Erdtree') return `<div class="fate-block"><div class="fate-title">FINAL AUDIENCE</div><div class="fate-copy">all required Remembrances have been claimed.</div></div>`;
  const required = capstoneRequirement(state);
  const fate = Math.round(capstoneChanceForState(state) * 100);
  const locked = state.cleared < required;
  const needed = Math.max(0, required - state.cleared);
  return `<div class="fate-block">
    <div class="progress-marks">${progressMarks(state)}</div>
    <div class="fate-title">${locked ? 'CAPSTONE SEALED' : (availableRegionalBosses(state).length ? `CAPSTONE CHANCE · ${fate}%` : 'CAPSTONE NEXT')}</div>

  </div>`;
}

function penanceMarkup(c) {

function commissionSmithingContract(state){
  const sm=smithingData(state),pool=availableBellBearings(state);
  const affordable=pool.filter(b=>sm.favor>=smithingContractCost(b));
  if(!affordable.length)return null;
  const next=smithingCopy(state),b=pick(affordable),cost=smithingContractCost(b),task=pick(TC_SMITHING_TASKS);
  next.smithing.favor-=cost;
  next.smithing.activeContract={bearingId:b.id,task,status:'task',cost,commissionedAt:new Date().toISOString()};
  next.lastAction=`A Bell Bearing Contract has been commissioned for ${b.name} for ${cost} Favor.`;
  return next;
}
function fulfillSmithingContract(state){const next=smithingCopy(state);if(!next.smithing.activeContract)return null;next.smithing.activeContract.status='sanctioned';next.lastAction='The union’s demands have been met. Custodian sanctioned.';return next;}
function claimSmithingBearing(state){
  const next=smithingCopy(state),ct=next.smithing.activeContract;
  if(!ct||ct.status!=='sanctioned')return null;
  const b=bellById(ct.bearingId);
  if(!b){
    setToast('This contract is no longer valid. No reward was spent or granted.');
    return null;
  }
  next.smithing.acquired=Array.from(new Set([...next.smithing.acquired,ct.bearingId]));
  next.smithing.masterworkCredits+=1;
  next.smithing.activeContract=null;
  next.lastAction=`${b.name} claimed. Hewg owes the Covenant one Masterwork.`;
  return next;
}
function masterworkCurrent(state,slot){
  const next=smithingCopy(state);
  if(next.smithing.masterworkCredits<1||!next.current)return null;
  const weapon=slot==='morgan'?next.current.morgan?.name:next.current.chase?.name;
  if(!weapon)return null;
  if(next.smithing.masterworks.includes(weapon)){
    setToast(`${weapon} is already Masterworked.`);
    return null;
  }
  next.smithing.masterworks.push(weapon);
  next.smithing.masterworkCredits-=1;
  next.lastAction=`Hewg has Masterworked ${weapon}.`;
  return next;
}

function renderPostBattleReport(){
  const state=run.state,c=state.current;
  if(!c){postBattleReport=null;return renderRun();}
  if(!postBattleReport || postBattleReport.encounterId!==c.id) postBattleReport={encounterId:c.id,rite:null,chaos:null};
  const riteReward=Number(c.weirdness?.favor??1);
  const chaosReward=Number(c.chaosFavor??1);
  const riteReady=riteReward<=0 || postBattleReport.rite!==null;
  const chaosAvailable=Boolean(c.chaosTriggered);
  const chaosReady=!chaosAvailable || chaosReward<=0 || postBattleReport.chaos!==null;
  const gained=(postBattleReport.rite===true?Math.max(0,riteReward):0)+(postBattleReport.chaos===true?Math.max(0,chaosReward):0);
  app.innerHTML=`<section class="tc-battle-report">
    <div class="tc-report-kicker">Encounter Complete</div>
    <div class="tc-report-victory">VICTORY</div>
    <div class="tc-report-boss">${h(c.target?.name||'Enemy Felled')}</div>
    <div class="tc-report-rule"></div>
    ${postBattleChoiceMarkup('rite','Odd Rite',`${h(c.weirdness?.name||'No Rite')} · ${h(c.weirdness?.text||'')}`,riteReward,true)}
    ${postBattleChoiceMarkup('chaos','Chaos',chaosAvailable?`${h(chaosEventName(c.chaosConsequence||''))} · ${h(personalizePlayers(c.chaosConsequence||'',state))}`:'The Chaos seal never broke during this encounter.',chaosReward,chaosAvailable)}
    <div class="tc-report-total"><span>Smithing Favor earned</span><strong>+${gained}</strong></div>
    <button id="finishBattleReport" class="btn gold" ${riteReady&&chaosReady?'':'disabled'}>${c.target?.exit?'Record Victory · Continue':'Record Victory · Roll Next Encounter'}</button>
    <div class="tc-report-note">${riteReady&&chaosReady?'The ledger updates when you submit this report.':'Answer the eligible honor-system checks first.'}</div>
  </section>`;
  document.querySelectorAll('[data-report-kind]').forEach(btn=>btn.addEventListener('click',()=>postBattleChoice(btn.dataset.reportKind,btn.dataset.reportValue==='1')));
  document.querySelector('#finishBattleReport')?.addEventListener('click',finalizePostBattleReport);
}
async function finalizePostBattleReport(){
  const state=run.state,c=state.current;
  if(!c || !postBattleReport || postBattleReport.encounterId!==c.id) return;
  const nextState=smithingCopy(state);
  const nc=nextState.current;
  let gained=0;
  const riteReward=Number(nc.weirdness?.favor??1);
  if(postBattleReport.rite===true && riteReward>0 && !nc.smithingRiteFavor){
    nc.smithingRiteFavor=true;
    nextState.smithing.favor+=riteReward;
    gained+=riteReward;
  }
  const chaosReward=Number(nc.chaosFavor??1);
  if(postBattleReport.chaos===true && nc.chaosTriggered && chaosReward>0 && !nc.smithingChaosFavor){
    nc.smithingChaosFavor=true;
    nextState.smithing.favor+=chaosReward;
    gained+=chaosReward;
  }
  const completed=completeEncounter(nextState,playerName());
  postBattleReport=null;
  if(!completed.regionComplete&&!completed.runComplete&&completed.current){
    pendingRevealId=completed.current.id;
    uiScreen='encounter';
  }
  await commit(completed,{successToast:gained?`Post-battle report filed · +${gained} Smithing Favor`:'Post-battle report filed.'});
}
