name: Deploy Flat Favor Economy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-favor-cap.yml'

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
          fetch-depth: 0

      - name: Update final-build documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tarnished-covenant/build-launch-refresh.py')
          s=p.read_text()
          old=("# Smithing Favor is reliable earned currency again: honoring Rite/Chaos awards\n"
               "# its Favor value directly, while the same points still produce random bonus\n"
               "# Covenant draws. Random Favor results remain extra rather than the only source.\n")
          new=("# Every completed Covenant encounter pays exactly +1 guaranteed Smithing Favor.\n"
               "# Honored Rite/Chaos objectives determine bonus reward draws; random Favor\n"
               "# results remain extra rather than multiplying the guaranteed encounter payout.\n")
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Build production app twice
        run: |
          python tarnished-covenant/build-launch-refresh.py
          python tarnished-covenant/build-launch-refresh.py

      - name: Verify Favor economy and shared report
        run: |
          python tarnished-covenant/test-favor-rebalance.py
          python tarnished-covenant/test-shared-post-battle-report.py
          python tarnished-covenant/test-today-systems-audit.py
          python tarnished-covenant/test-coop-world-clears.py
          python tarnished-covenant/test-shared-reward-draw.py
          python tarnished-covenant/test-expanded-reward-pool.py
          python tarnished-covenant/test-masterwork-recall.py
          python tarnished-covenant/test-compendium-dossier.py
          python tarnished-covenant/test-regression-invariants.py
          python tarnished-covenant/test-final-release-invariants.py

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/tarnished-covenant.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tarnished-covenant.js

      - name: Commit production build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/build-launch-refresh.py tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'No generated app changes.'
          else
            git commit -m 'Cap guaranteed Smithing Favor at one per fight'
            git fetch origin tarnished-covenant-assets
            git rebase origin/tarnished-covenant-assets
            git push origin HEAD:tarnished-covenant-assets
          fi
