name: Deploy Erdtree Writs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-erdtree-writs.yml'

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
          fetch-depth: 0

      - name: Wire Erdtree Writs into final production build
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('tarnished-covenant/build-launch-refresh.py')
          s=p.read_text()
          build="runpy.run_path('tarnished-covenant/build-erdtree-writs.py')"
          if build not in s:
              anchor="runpy.run_path('tarnished-covenant/build-shared-smithing-contract-sync.py')\n"
              insert=("\n# Physick-bearing Minor Erdtree Avatars live outside the ordinary boss pool.\n"
                      "# A finite shared Erdtree Writ reward authorizes one reachable Avatar;\n"
                      "# legacy Avatar victories reduce the remaining issue cap for existing runs.\n"
                      +build+"\n")
              if anchor not in s: raise SystemExit('Erdtree Writ build anchor missing')
              s=s.replace(anchor,anchor+insert,1)
          test="runpy.run_path('tarnished-covenant/test-erdtree-writs.py')"
          if test not in s:
              anchor="runpy.run_path('tarnished-covenant/test-shared-smithing-contract-sync.py')\n"
              if anchor not in s: raise SystemExit('Erdtree Writ test anchor missing')
              s=s.replace(anchor,anchor+test+"\n",1)
          old="'PREREQUISITE NEXT','function tcMaybeSurfaceSharedContract(state=run?.state)']"
          new="'PREREQUISITE NEXT','function tcMaybeSurfaceSharedContract(state=run?.state)','const TC_ERDTREE_TARGETS=[','function tcBuildErdtreeWritSpend(latest,targetId,actor)']"
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('Erdtree final invariant anchor missing')
          p.write_text(s)

          # The expanded reward builder sees three generations of the shared
          # payout list: the original six counters, the current strategic list,
          # and the new strategic+Writ list. Normalize either older form to the
          # Writ-aware form so both the migration build and every later rebuild
          # are safe.
          legacy_keys="const keys=['favor','chaosRefreshes','riteRefreshes','appealWaivers','aviaryTickets','freeBossKills'];"
          strategic_keys="const keys=['favor','chaosRefreshes','riteRefreshes','appealWaivers','aviaryTickets','freeBossKills','bossVetoes','clemencies','unionDiscounts','blankAmendments','jointAppeals'];"
          writ_keys="const keys=['favor','chaosRefreshes','riteRefreshes','appealWaivers','aviaryTickets','freeBossKills','bossVetoes','clemencies','unionDiscounts','blankAmendments','jointAppeals','erdtreeWrits','erdtreeWritsAwarded'];"
          p=Path('tarnished-covenant/build-expanded-reward-pool.py')
          t=p.read_text()
          old_line='old_keys="'+legacy_keys+'"\nnew_keys="'+strategic_keys+'"\nif old_keys in s:s=s.replace(old_keys,new_keys)\nelif new_keys not in s:raise SystemExit(\'shared reward delta key target missing\')'
          new_line='old_keys="'+legacy_keys+'"\nstrategic_keys="'+strategic_keys+'"\nnew_keys="'+writ_keys+'"\nif old_keys in s:s=s.replace(old_keys,new_keys)\nelif strategic_keys in s:s=s.replace(strategic_keys,new_keys)\nelif new_keys not in s:raise SystemExit(\'shared reward delta key target missing\')'
          if old_line in t:
              t=t.replace(old_line,new_line,1)
          elif new_line not in t:
              raise SystemExit('expanded reward shared-key migration block missing')
          p.write_text(t)

          # Update every regression that intentionally pins the exact strategic
          # shared key list so the finite Writ counters are part of the contract.
          for p in Path('tarnished-covenant').glob('test-*.py'):
              t=p.read_text()
              if strategic_keys in t:
                  p.write_text(t.replace(strategic_keys,writ_keys))
          PY

      - name: Build production app twice
        run: |
          python tarnished-covenant/build-launch-refresh.py
          python tarnished-covenant/build-launch-refresh.py

      - name: Verify Erdtree Writs and regressions
        run: |
          python tarnished-covenant/test-erdtree-writs.py
          python tarnished-covenant/test-expanded-reward-pool.py
          python tarnished-covenant/test-free-boss-kill.py
          python tarnished-covenant/test-boss-prerequisites.py
          python tarnished-covenant/test-today-systems-audit.py
          python tarnished-covenant/test-shared-reward-draw.py
          python tarnished-covenant/test-live-reward-watch.py
          python tarnished-covenant/test-masterwork-recall.py
          python tarnished-covenant/test-shared-smithing-contract-sync.py
          python tarnished-covenant/test-regression-invariants.py
          python tarnished-covenant/test-final-release-invariants.py

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/tarnished-covenant.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tarnished-covenant.js

      - name: Commit production build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/build-launch-refresh.py tarnished-covenant/build-expanded-reward-pool.py tarnished-covenant/test-*.py tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'No generated app changes.'
          else
            git commit -m 'Add finite Erdtree Writ Physick system'
            git fetch origin tarnished-covenant-assets
            git rebase origin/tarnished-covenant-assets
            git push origin HEAD:tarnished-covenant-assets
          fi
