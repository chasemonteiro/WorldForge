name: Repair Reward Slot Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-reward-slot-source.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Repair malformed tap-target CSS source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tarnished-covenant/build-reward-slot.py')
          s=p.read_text()
          start=s.find("if '\n/* Reward reveal Continue must remain a real iOS Home Screen tap target. */")
          end_marker="s=s.replace('</style>',css+'\\n</style>',1)"
          end=s.find(end_marker,start)
          if start < 0 or end < 0:
              raise SystemExit('malformed reward tap-target source block not found')
          end += len(end_marker)
          replacement=r'''tap_css=r'''
/* Reward reveal Continue must remain a real iOS Home Screen tap target. */
.tc-reward-machine #tcRewardContinue{
  position:relative;
  z-index:20;
  pointer-events:auto;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
'''
if '</style>' not in s: raise SystemExit('style end missing')
s=s.replace('</style>',css+'\n'+tap_css+'\n</style>',1)'''
          p.write_text(s[:start]+replacement+s[end:])
          PY
          python -m py_compile tarnished-covenant/build-reward-slot.py
          grep -q 'tap_css=' tarnished-covenant/build-reward-slot.py
          grep -q 'tcRewardContinue' tarnished-covenant/build-reward-slot.py
      - name: Commit builder repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/build-reward-slot.py
          git commit -m 'Repair reward slot builder syntax'
          git push origin HEAD:tarnished-covenant-assets
