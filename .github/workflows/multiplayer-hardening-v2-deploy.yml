name: Deploy Multiplayer Hardening v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/multiplayer-hardening-v2-deploy.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Reapply multiplayer synchronization hardening
        run: python tarnished-covenant/build-multiplayer-hardening.py
      - name: Apply multiplayer synchronization hardening v2
        run: python tarnished-covenant/build-multiplayer-hardening-v2.py
      - name: Repair final Covenant refresh handler
        run: python tarnished-covenant/build-refresh-handler-final.py
      - name: Refresh Home Screen build id
        run: python tarnished-covenant/build-launch-refresh.py
      - name: Assert multiplayer invariants
        run: python tarnished-covenant/test-multiplayer-invariants.py
      - name: Assert multiplayer v2 invariants
        run: python tarnished-covenant/test-multiplayer-v2-invariants.py
      - name: Assert regression invariants
        run: python tarnished-covenant/test-regression-invariants.py
      - name: Assert final release invariants
        run: python tarnished-covenant/test-final-release-invariants.py
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/tarnished-covenant.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tarnished-covenant.js
      - name: Commit hardened app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'No app changes to commit.'
          else
            git commit -m 'Harden Covenant multiplayer synchronization v2'
            git push origin HEAD:tarnished-covenant-assets
          fi
