name: Patch Ledger Flicker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ledger-flicker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Disable Ledger entrance animation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tarnished-covenant/index.html')
          s=p.read_text()
          start=s.find('function renderLedger() {')
          end=s.find('\nfunction renderSettings()', start)
          if start < 0 or end < 0: raise SystemExit('renderLedger scope missing')
          chunk=s[start:end]
          old='app.innerHTML=`<section class="tc-screen">${screenTop(title)}'
          new='app.innerHTML=`<section class="tc-screen tc-ledger-screen">${screenTop(title)}'
          if new not in chunk:
            if old not in chunk: raise SystemExit('Ledger section target missing')
            chunk=chunk.replace(old,new,1)
            s=s[:start]+chunk+s[end:]
          if '.tc-ledger-screen{animation:none!important}' not in s:
            if '</style>' not in s: raise SystemExit('style marker missing')
            s=s.replace('</style>','\n/* Ledger visual stability: do not replay global screen-entry animation. */\n.tc-ledger-screen{animation:none!important}\n</style>',1)
          p.write_text(s)
          PY
      - name: Verify Ledger stability patch
        run: |
          grep -q 'tc-screen tc-ledger-screen' tarnished-covenant/index.html
          grep -q '.tc-ledger-screen{animation:none!important}' tarnished-covenant/index.html
          grep -q 'Covenant Office Memorandum' tarnished-covenant/index.html
          grep -q 'tarnished.dev/weapon-calculator' tarnished-covenant/index.html
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/tc.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tc.js
      - name: Commit Ledger stability patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          git commit -m 'Stop Ledger entrance flicker'
          git push origin HEAD:tarnished-covenant-assets
