name: Deploy Direct Covenant Refresh Handler Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-refresh-handler-fix.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
          fetch-depth: 0
      - name: Remove outer refresh wrappers
        run: |
          python tarnished-covenant/build-final-release-hardening.py
          python tarnished-covenant/build-launch-refresh.py
      - name: Validate actual refresh click path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          if 'tcUseCovenantBoonBefore' in html:
              raise SystemExit('outer Covenant boon wrapper still present')
          if "const btn=event.target.closest('[data-use-boon]');" not in html:
              raise SystemExit('refresh delegated click listener missing')
          if "if(btn)useCovenantBoon(btn.dataset.useBoon);" not in html:
              raise SystemExit('refresh listener does not call real handler')
          core="if(window.__tcBoonBusy||!run?.state?.current)return;window.__tcBoonBusy=true;"
          if html.count(core)!=1:
              raise SystemExit(f'expected one core busy guard, found {html.count(core)}')
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          Path('/tmp/tc-refresh.js').write_text('\n'.join(scripts))
          PY
          python tarnished-covenant/test-regression-invariants.py
          node --check /tmp/tc-refresh.js
      - name: Commit live fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          git commit -m 'Fix Covenant refresh click handler' || exit 0
          git push origin HEAD:tarnished-covenant-assets
