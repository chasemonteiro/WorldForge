name: Inspect Favor Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-favor.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Print battle report code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('tarnished-covenant/index.html').read_text()
          for needle in ['function renderPostBattleReport()','async function finalizePostBattleReport()','function postBattleChoice(kind,value)','Guaranteed Smithing Favor']:
              i=s.find(needle)
              print('\n===== '+needle+' =====')
              if i<0:
                  print('NOT FOUND')
              else:
                  print(s[max(0,i-1800):min(len(s),i+6000)])
          PY
