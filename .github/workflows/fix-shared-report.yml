name: Fix Shared Battle Report Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-shared-report.yml'

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
          fetch-depth: 0

      - name: Normalize shared report source and wire final build
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('tarnished-covenant/build-shared-post-battle-report.py')
          s=p.read_text()
          s=s.replace('guaranteedFavor+=riteDraws;','guaranteedFavor=Number(guaranteedFavor)+riteDraws;')
          s=s.replace('guaranteedFavor+=chaosDraws;','guaranteedFavor=Number(guaranteedFavor)+chaosDraws;')
          p.write_text(s)

          p=Path('tarnished-covenant/build-launch-refresh.py')
          s=p.read_text()
          build_line="runpy.run_path('tarnished-covenant/build-shared-post-battle-report.py')"
          if build_line not in s:
              anchor="# Masterworked weapons become owner-bound veteran assets with one future\n"
              if anchor not in s:
                  anchor="# The Compendium is an archive/case-file surface, not a spreadsheet. This late\n"
              insert=("# The post-battle report is one shared co-op artifact. Both phones mirror the\n"
                      "# same Rite/Chaos answers and guaranteed Favor total before either may file it.\n"
                      +build_line+"\n\n")
              if anchor not in s: raise SystemExit('shared report build anchor missing')
              s=s.replace(anchor,insert+anchor,1)
          test_line="runpy.run_path('tarnished-covenant/test-shared-post-battle-report.py')"
          if test_line not in s:
              anchor="runpy.run_path('tarnished-covenant/test-masterwork-recall.py')"
              if anchor not in s:
                  anchor="runpy.run_path('tarnished-covenant/test-compendium-dossier.py')"
              if anchor not in s: raise SystemExit('shared report test anchor missing')
              s=s.replace(anchor,test_line+'\n'+anchor,1)
          invariant="'function tcSharedBattleReportDraft(state=run?.state)'"
          if invariant not in s:
              anchor="'function tcBuildMasterworkRecall(latest,encounterId,recordId,expectedCurrentWeapon,slot,actor)'"
              if anchor in s:
                  s=s.replace(anchor,invariant+','+anchor,1)
              else:
                  anchor="'Office of Covenant Records'"
                  if anchor not in s: raise SystemExit('shared report invariant anchor missing')
                  s=s.replace(anchor,invariant+','+anchor,1)
          p.write_text(s)
          PY

      - name: Build production app twice
        run: |
          python tarnished-covenant/build-launch-refresh.py
          python tarnished-covenant/build-launch-refresh.py

      - name: Verify shared report and Favor
        run: |
          python tarnished-covenant/test-shared-post-battle-report.py
          python tarnished-covenant/test-favor-rebalance.py
          python tarnished-covenant/test-coop-world-clears.py
          python tarnished-covenant/test-shared-reward-draw.py
          python tarnished-covenant/test-today-systems-audit.py
          python tarnished-covenant/test-masterwork-recall.py
          python tarnished-covenant/test-compendium-dossier.py
          python tarnished-covenant/test-regression-invariants.py
          python tarnished-covenant/test-final-release-invariants.py

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/tarnished-covenant.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tarnished-covenant.js

      - name: Commit production build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/build-shared-post-battle-report.py tarnished-covenant/build-launch-refresh.py tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'No generated app changes.'
          else
            git commit -m 'Fix shared guaranteed Favor report sync'
            git fetch origin tarnished-covenant-assets
            git rebase origin/tarnished-covenant-assets
            git push origin HEAD:tarnished-covenant-assets
          fi
