name: Patch Panel Scroll and Ledger Cache

on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-panel-scroll-ledger-cache.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Apply panel scroll and Ledger cache fix
        run: python tarnished-covenant/build-standalone-spacing-ledger.py
      - name: Verify focused fix
        run: |
          grep -q "if(panels\[i\])panels\[i\].scrollTop=0" tarnished-covenant/index.html
          grep -q "Persistent Ledger DOM cache" tarnished-covenant/index.html
          grep -q "app.replaceChildren(tcLedgerCachedNode)" tarnished-covenant/index.html
          grep -q "height:clamp(180px,24vh,230px)!important" tarnished-covenant/index.html
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text();scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          Path('/tmp/tarnished-covenant.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tarnished-covenant.js
      - name: Commit focused fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'Already patched.'
          else
            git commit -m 'Reset briefing scroll and cache Ledger DOM'
            git push origin tarnished-covenant-assets
          fi
