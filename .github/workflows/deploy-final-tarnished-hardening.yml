name: Deploy Final Tarnished Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-final-tarnished-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
          fetch-depth: 0

      - name: Validate durable hardening source
        run: |
          python -m py_compile tarnished-covenant/build-final-release-hardening.py
          python -m py_compile tarnished-covenant/build-grace-animation-stability.py
          python -m py_compile tarnished-covenant/test-final-release-invariants.py

      - name: Patch only confirmed live defects
        run: |
          python tarnished-covenant/build-grace-animation-stability.py
          python tarnished-covenant/build-final-release-hardening.py
          python tarnished-covenant/build-launch-refresh.py

      - name: Validate repaired live app
        run: |
          python tarnished-covenant/test-regression-invariants.py
          python tarnished-covenant/test-final-release-invariants.py
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          if not scripts: raise SystemExit('No inline scripts found')
          Path('/tmp/tc-final.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tc-final.js

      - name: Commit repaired live app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'No live changes to commit.'
          else
            git commit -m 'Harden Tarnished Covenant final release'
            git push origin HEAD:tarnished-covenant-assets
          fi

      - name: Update permanent manual build recipe
        run: |
          git checkout -B main origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-tarnished-covenant.yml')
          s=p.read_text()

          old="""      - name: Assert stable Grace animation
                  run: |
                    grep -q 'Stable Grace frame renderer' tarnished-covenant/index.html
                    grep -q 'tcGraceStableShow' tarnished-covenant/index.html
                    grep -q 'const sequence=\\[0,1,2,1,0,1\\]' tarnished-covenant/index.html
                    grep -q 'TC_GRACE_TAP_COOLDOWN_MS=400' tarnished-covenant/index.html
          """
          new="""      - name: Assert native Grace animation
                  run: |
                    grep -q 'Grace wisp tuning' tarnished-covenant/index.html
                    grep -q 'Grace fidget tuning' tarnished-covenant/index.html
                    grep -q 'tc-grace-tap-count' tarnished-covenant/index.html
                    grep -q 'TC_GRACE_TAP_COOLDOWN_MS=100' tarnished-covenant/index.html
                    if grep -q 'TC_GRACE_ART_FRAMES' tarnished-covenant/index.html; then exit 1; fi
          """
          if old not in s:
              raise SystemExit('obsolete Grace assertion block not found')
          s=s.replace(old,new,1)

          anchor="""      - name: Finalize Home Screen build id
                run: python tarnished-covenant/build-launch-refresh.py
          """
          insertion="""      - name: Apply final reward and archive hardening
                run: python tarnished-covenant/build-final-release-hardening.py
              - name: Finalize Home Screen build id
                run: python tarnished-covenant/build-launch-refresh.py
          """
          if 'Apply final reward and archive hardening' not in s:
              if anchor not in s: raise SystemExit('final build-id anchor not found')
              s=s.replace(anchor,insertion,1)

          anchor2="""      - name: Validate JavaScript syntax
                run: |
          """
          insertion2="""      - name: Assert final release invariants
                run: python tarnished-covenant/test-final-release-invariants.py
              - name: Validate JavaScript syntax
                run: |
          """
          if 'Assert final release invariants' not in s:
              if anchor2 not in s: raise SystemExit('JS validation anchor not found')
              s=s.replace(anchor2,insertion2,1)

          p.write_text(s)
          PY
          git add .github/workflows/build-tarnished-covenant.yml
          if git diff --cached --quiet; then
            echo 'Production workflow already current.'
          else
            git commit -m 'Harden Tarnished Covenant production build'
            git push origin main
          fi
