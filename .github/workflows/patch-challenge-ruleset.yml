name: Patch Challenge Ruleset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-challenge-ruleset.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Apply challenge-first ruleset
        run: python tarnished-covenant/build-challenge-ruleset.py
      - name: Verify challenge ruleset
        run: |
          if grep -q 'for="severity"' tarnished-covenant/index.html; then exit 1; fi
          grep -q "severity: 'cursed'" tarnished-covenant/index.html
          grep -q 'function tcRefreshCost' tarnished-covenant/index.html
          grep -q 'function tcPickRite' tarnished-covenant/index.html
          grep -q 'function tcPickChaosTrigger' tarnished-covenant/index.html
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text();scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          Path('/tmp/tarnished-covenant.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tarnished-covenant.js
      - name: Commit challenge ruleset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          git commit -m 'Restore challenge-first Covenant ruleset'
          git push origin HEAD:tarnished-covenant-assets
