name: Patch Standalone Top Inset

on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-standalone-top-inset.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Remove duplicate standalone top inset
        run: python tarnished-covenant/build-ios-standalone-shell.py
      - name: Verify minimal correction
        run: |
          grep -q 'padding-top:8px!important' tarnished-covenant/index.html
          grep -q 'height:100vh!important' tarnished-covenant/index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('tarnished-covenant/index.html').read_text()
          block=s[s.index('/* --- iOS standalone viewport correction --- */'):s.index('</style>',s.index('/* --- iOS standalone viewport correction --- */'))]
          assert 'padding-top:8px!important' in block
          assert 'padding-top:calc(8px + env(safe-area-inset-top))' not in block
          PY
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          Path('/tmp/tarnished-covenant.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tarnished-covenant.js
      - name: Commit corrected spacing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'Already corrected.'
          else
            git commit -m 'Move standalone primary screens up'
            git push origin tarnished-covenant-assets
          fi
