name: Build Tarnished Covenant

on:
  push:
    branches: [tarnished-covenant-assets]
    paths:
      - 'tarnished-covenant/chunks/**'
      - 'tarnished-covenant/build-*.py'
      - 'tarnished-covenant/regional-pools.js'
      - '.github/workflows/build-tarnished-covenant.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets

      - name: Assemble page
        run: |
          cat tarnished-covenant/chunks/part0.txt \
              tarnished-covenant/chunks/part1.txt \
              tarnished-covenant/chunks/part2.txt \
              tarnished-covenant/chunks/part3.txt \
              tarnished-covenant/chunks/part4.txt \
              tarnished-covenant/chunks/part5.txt \
              tarnished-covenant/chunks/part6.txt \
              > tarnished-covenant/index.html

      - name: Patch app behavior
        run: python tarnished-covenant/build-behavior.py

      - name: Patch progression and Remembrances
        run: python tarnished-covenant/build-progression.py

      - name: Repair region table closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tarnished-covenant/index.html')
          s = p.read_text()
          old = "  }\n\n\nregions['Siofra River + Nokron']"
          new = "  }\n};\n\nregions['Siofra River + Nokron']"
          if old not in s:
              raise SystemExit('region closure repair target not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply spreadsheet regional pools
        run: python tarnished-covenant/build-regional-pools.py

      - name: Apply screen-based UI
        run: python tarnished-covenant/build-ui.py

      - name: Commit assembled page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Assemble Tarnished Covenant app'
            git push origin tarnished-covenant-assets
          fi
