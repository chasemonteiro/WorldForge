name: Build Tarnished Covenant

on:
  push:
    branches: [tarnished-covenant-assets]
    paths:
      - 'tarnished-covenant/chunks/**'
      - '.github/workflows/build-tarnished-covenant.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Assemble page
        run: |
          cat tarnished-covenant/chunks/part0.txt \
              tarnished-covenant/chunks/part1.txt \
              tarnished-covenant/chunks/part2.txt \
              tarnished-covenant/chunks/part3.txt \
              tarnished-covenant/chunks/part4.txt \
              tarnished-covenant/chunks/part5.txt \
              tarnished-covenant/chunks/part6.txt \
              > tarnished-covenant/index.html
      - name: Patch restart and share URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tarnished-covenant/index.html')
          s = p.read_text()
          s = s.replace(
              "APP_URL: 'https://qwnwksyiofolldliaqhf.supabase.co/functions/v1/tarnished-covenant'",
              "APP_URL: 'https://chasemonteiro.github.io/WorldForge/tarnished-covenant/'"
          )
          old = """    try {\n      const restarted = await backend.restartRun(run.id, buildFreshState(run.state));\n      run = { ...run, ...restarted };\n      renderRun();\n      setToast('Run restarted.');\n    } catch (error) {\n      console.error(error);\n      setToast(error.message || 'Restart failed. Try again.');\n      const retry = document.querySelector('#confirmRestart');\n      if (retry) { retry.disabled = false; retry.textContent = 'Erase Run & Restart'; }\n    }\n"""
          new = """    try {\n      const freshState = buildFreshState(run.state);\n      unsubscribe?.();\n      clearSession();\n      clearLocalRun();\n      const created = await backend.createRun(playerName(), freshState);\n      run = created;\n      session = { runId: run.id, joinCode: run.joinCode, displayName: playerName() };\n      saveSession(session);\n      subscribe();\n      renderRun();\n      setToast(backend.mode === 'shared' ? `New Covenant started. New code: ${run.joinCode}` : 'New run started.');\n    } catch (error) {\n      console.error(error);\n      setToast(error.message || 'Could not start a fresh Covenant.');\n      const retry = document.querySelector('#confirmRestart');\n      if (retry) { retry.disabled = false; retry.textContent = 'Erase Run & Restart'; }\n    }\n"""
          if old not in s:
              raise SystemExit('restart block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit assembled page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Assemble Tarnished Covenant app'
            git push origin tarnished-covenant-assets
          fi
