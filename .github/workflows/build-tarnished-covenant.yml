name: Build Tarnished Covenant

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tarnished-covenant-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Assemble and verify the complete release offline
        run: python tarnished-covenant/tools/build.py --test
      - name: Commit generated output only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html tarnished-covenant/regional-pools.js
          if git diff --cached --quiet; then
            echo 'Verified release already matches its sources.'
          else
            git commit -m 'Build verified Tarnished Covenant release'
            git push origin HEAD:tarnished-covenant-assets
          fi
