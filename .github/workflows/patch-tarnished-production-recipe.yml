name: Patch Tarnished Production Recipe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tarnished-production-recipe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update manual build recipe
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/workflows/build-tarnished-covenant.yml')
          s=p.read_text()

          pattern=r"      - name: Assert stable Grace animation\n        run: \|\n(?:          .*\n){4}"
          replacement="""      - name: Assert native Grace animation
                run: |
                  grep -q 'Grace wisp tuning' tarnished-covenant/index.html
                  grep -q 'Grace fidget tuning' tarnished-covenant/index.html
                  grep -q 'tc-grace-tap-count' tarnished-covenant/index.html
                  grep -q 'TC_GRACE_TAP_COOLDOWN_MS=100' tarnished-covenant/index.html
                  if grep -q 'TC_GRACE_ART_FRAMES' tarnished-covenant/index.html; then exit 1; fi
          """
          replacement=replacement.replace('              run:','        run:').replace('                grep','          grep').replace('                if','          if')
          s,n=re.subn(pattern,replacement,s,count=1)
          if n!=1: raise SystemExit('obsolete Grace assertion block not found')

          build_anchor="      - name: Finalize Home Screen build id\n        run: python tarnished-covenant/build-launch-refresh.py\n"
          build_insert="      - name: Apply final reward and archive hardening\n        run: python tarnished-covenant/build-final-release-hardening.py\n"+build_anchor
          if 'Apply final reward and archive hardening' not in s:
              if build_anchor not in s: raise SystemExit('build-id anchor missing')
              s=s.replace(build_anchor,build_insert,1)

          js_anchor="      - name: Validate JavaScript syntax\n        run: |\n"
          js_insert="      - name: Assert final release invariants\n        run: python tarnished-covenant/test-final-release-invariants.py\n"+js_anchor
          if 'Assert final release invariants' not in s:
              if js_anchor not in s: raise SystemExit('JS validation anchor missing')
              s=s.replace(js_anchor,js_insert,1)

          p.write_text(s)
          PY
          python - <<'PY'
          import yaml
          from pathlib import Path
          y=yaml.safe_load(Path('.github/workflows/build-tarnished-covenant.yml').read_text())
          steps=y['jobs']['build']['steps']
          names=[x.get('name','') for x in steps]
          for name in ['Assert native Grace animation','Apply final reward and archive hardening','Assert final release invariants']:
              if name not in names: raise SystemExit('workflow step missing: '+name)
          if 'Assert stable Grace animation' in names: raise SystemExit('obsolete Grace assertion remains')
          PY
      - name: Commit production recipe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-tarnished-covenant.yml
          git commit -m 'Harden Tarnished Covenant production build'
          git push origin main
