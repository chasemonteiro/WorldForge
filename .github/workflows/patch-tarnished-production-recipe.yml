name: Patch Tarnished Production Recipe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tarnished-production-recipe.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update manual build recipe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-tarnished-covenant.yml')
          lines=p.read_text().splitlines()

          def step_index(name):
              target='      - name: '+name
              try:return lines.index(target)
              except ValueError:raise SystemExit('workflow step not found: '+name)

          # Replace the obsolete raster/400ms assertion step as one YAML block.
          i=step_index('Assert stable Grace animation')
          j=i+1
          while j<len(lines) and not lines[j].startswith('      - name:'):
              j+=1
          lines[i:j]=[
              '      - name: Assert native Grace animation',
              '        run: |',
              "          grep -q 'Grace wisp tuning' tarnished-covenant/index.html",
              "          grep -q 'Grace fidget tuning' tarnished-covenant/index.html",
              "          grep -q 'tc-grace-tap-count' tarnished-covenant/index.html",
              "          grep -q 'TC_GRACE_TAP_COOLDOWN_MS=100' tarnished-covenant/index.html",
              "          if grep -q 'TC_GRACE_ART_FRAMES' tarnished-covenant/index.html; then exit 1; fi",
          ]

          # Final reward/archive durability runs after every other late UI layer.
          if not any('Apply final reward and archive hardening' in x for x in lines):
              i=step_index('Finalize Home Screen build id')
              lines[i:i]=[
                  '      - name: Apply final reward and archive hardening',
                  '        run: python tarnished-covenant/build-final-release-hardening.py',
              ]

          # Final release-specific invariants run alongside the broader regression suite.
          if not any('Assert final release invariants' in x for x in lines):
              i=step_index('Validate JavaScript syntax')
              lines[i:i]=[
                  '      - name: Assert final release invariants',
                  '        run: python tarnished-covenant/test-final-release-invariants.py',
              ]

          p.write_text('\n'.join(lines)+'\n')
          PY
          python - <<'PY'
          import yaml
          from pathlib import Path
          y=yaml.safe_load(Path('.github/workflows/build-tarnished-covenant.yml').read_text())
          steps=y['jobs']['build']['steps']
          names=[x.get('name','') for x in steps]
          for name in ['Assert native Grace animation','Apply final reward and archive hardening','Assert final release invariants']:
              if name not in names: raise SystemExit('workflow step missing: '+name)
          if 'Assert stable Grace animation' in names: raise SystemExit('obsolete Grace assertion remains')
          PY
      - name: Commit production recipe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-tarnished-covenant.yml
          git commit -m 'Harden Tarnished Covenant production build'
          git push origin main
