name: Patch Standalone Spacing and Ledger

on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-standalone-spacing-ledger.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Apply standalone spacing and Ledger polish
        run: python tarnished-covenant/build-standalone-spacing-ledger.py
      - name: Verify focused patch
        run: |
          grep -q 'Standalone spacing + stable Ledger shell' tarnished-covenant/index.html
          grep -q 'tc-screen tc-ledger-shell' tarnished-covenant/index.html
          grep -q 'height:clamp(190px,31vh,275px)!important' tarnished-covenant/index.html
          grep -q 'body:has(.tc-ledger-shell) .app-shell' tarnished-covenant/index.html
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text();scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          Path('/tmp/tarnished-covenant.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tarnished-covenant.js
      - name: Commit focused patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'Already patched.'
          else
            git commit -m 'Polish standalone spacing and Ledger transitions'
            git push origin tarnished-covenant-assets
          fi
