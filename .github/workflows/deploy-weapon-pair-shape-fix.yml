name: Deploy Weapon Pair Shape Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-weapon-pair-shape-fix.yml']
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
          fetch-depth: 0
      - name: Build twice
        run: |
          python tarnished-covenant/build-launch-refresh.py
          python tarnished-covenant/build-launch-refresh.py
      - name: Test
        run: |
          python tarnished-covenant/test-weapon-accessibility.py
          python tarnished-covenant/test-reward-reveal-exit-hardening.py
          python tarnished-covenant/test-coop-world-clears.py
          python tarnished-covenant/test-shared-reward-draw.py
          python tarnished-covenant/test-live-reward-watch.py
          python tarnished-covenant/test-shared-post-battle-report.py
          python tarnished-covenant/test-regression-invariants.py
          python tarnished-covenant/test-final-release-invariants.py
      - name: JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('tarnished-covenant/index.html').read_text()
          Path('/tmp/tc.js').write_text('\n'.join(re.findall(r'<script(?:[^>]*)>(.*?)</script>',h,flags=re.S)))
          PY
          node --check /tmp/tc.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then echo 'No generated changes'; else git commit -m 'Fix malformed encounter weapon pair shape'; git fetch origin tarnished-covenant-assets; git rebase origin/tarnished-covenant-assets; git push origin HEAD:tarnished-covenant-assets; fi
