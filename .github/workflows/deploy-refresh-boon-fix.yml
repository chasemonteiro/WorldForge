name: Deploy Covenant Refresh Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-refresh-boon-fix.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
          fetch-depth: 0
      - name: Remove duplicate refresh guard
        run: |
          python tarnished-covenant/build-final-release-hardening.py
          python tarnished-covenant/build-launch-refresh.py
      - name: Validate refresh fix
        run: |
          python tarnished-covenant/test-regression-invariants.py
          python tarnished-covenant/test-final-release-invariants.py
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          if not scripts: raise SystemExit('No inline scripts found')
          Path('/tmp/tc-refresh-fix.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tc-refresh-fix.js
      - name: Commit live fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'No live changes to commit.'
          else
            git commit -m 'Fix Chaos and Rite refresh buttons'
            git push origin HEAD:tarnished-covenant-assets
          fi
