name: Patch Encounter Actions Up

on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-encounter-actions-up.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Raise Encounter actions slightly
        run: python tarnished-covenant/build-ios-standalone-shell.py
      - name: Verify minimal action adjustment
        run: |
          grep -q 'html.tc-standalone .tc-encounter-actions' tarnished-covenant/index.html
          grep -q 'margin-bottom:12px!important' tarnished-covenant/index.html
          grep -q 'padding-top:8px!important' tarnished-covenant/index.html
          grep -q 'height:100vh!important' tarnished-covenant/index.html
      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          Path('/tmp/tarnished-covenant.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tarnished-covenant.js
      - name: Commit action spacing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'Already adjusted.'
          else
            git commit -m 'Raise standalone Encounter actions'
            git push origin tarnished-covenant-assets
          fi
