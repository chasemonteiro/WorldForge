name: Deploy Native Grace Ritual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-native-grace.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
          fetch-depth: 0
      - name: Validate Grace builders
        run: |
          python -m py_compile tarnished-covenant/build-grace-idle.py
          python -m py_compile tarnished-covenant/build-grace-animation-stability.py
      - name: Apply native Grace ritual
        run: |
          python tarnished-covenant/build-grace-idle.py
          python tarnished-covenant/build-grace-animation-stability.py
          python tarnished-covenant/build-launch-refresh.py
      - name: Validate native Grace
        run: |
          grep -q 'tc-grace-native-svg' tarnished-covenant/index.html
          grep -q 'tcGraceNativeMarkup' tarnished-covenant/index.html
          grep -q 'TC_GRACE_TAP_COOLDOWN_MS=400' tarnished-covenant/index.html
          grep -q 'TC_GRACE_FAVOR_ODDS=5000' tarnished-covenant/index.html
          if grep -q 'TC_GRACE_ART_FRAMES' tarnished-covenant/index.html; then exit 1; fi
          if grep -q 'tc-grace-idle-art-frame' tarnished-covenant/index.html; then exit 1; fi
          if grep -q 'tc-grace-idle-art-stack' tarnished-covenant/index.html; then exit 1; fi
          python tarnished-covenant/test-regression-invariants.py
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/tc.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tc.js
      - name: Commit live app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then echo 'No changes to commit.'; else git commit -m 'Restore native Site of Grace ritual'; git push origin HEAD:tarnished-covenant-assets; fi
