name: Locate Compendium Marker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/locate-compendium-marker.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Locate marker
        run: grep -R -n -C 4 "Compendium footer marker missing" tarnished-covenant || true
