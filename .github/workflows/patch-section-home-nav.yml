name: Patch Section Home Nav

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-section-home-nav.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Return primary section nav to first panel
        run: python tarnished-covenant/build-section-home-nav.py
      - name: Verify section-home navigation
        run: |
          grep -q 'Bottom nav returns primary sections to panel one' tarnished-covenant/index.html
          grep -q "btn.dataset.screen==='sanctuary'" tarnished-covenant/index.html
          grep -q "tcSanctuaryPanelIndex=0" tarnished-covenant/index.html
          grep -q "btn.dataset.screen==='encounter'" tarnished-covenant/index.html
          grep -q "tcEncounterPanelIndex=0" tarnished-covenant/index.html
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/tc.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tc.js
      - name: Commit section-home navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          git commit -m 'Return section nav to first panel'
          git push origin HEAD:tarnished-covenant-assets
