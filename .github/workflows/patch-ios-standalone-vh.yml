name: Patch iOS Standalone VH

on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-ios-standalone-vh.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Patch iOS standalone viewport
        run: python tarnished-covenant/build-ios-standalone-shell.py
      - name: Verify standalone viewport correction
        run: |
          grep -q 'apple-mobile-web-app-status-bar-style" content="black-translucent"' tarnished-covenant/index.html
          grep -q 'iOS standalone viewport correction' tarnished-covenant/index.html
          grep -q 'height:100vh!important' tarnished-covenant/index.html
      - name: Commit standalone correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'Already patched.'
          else
            git commit -m 'Correct iOS Home Screen viewport height'
            git push origin tarnished-covenant-assets
          fi
