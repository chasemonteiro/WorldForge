name: Patch Reward Continue Touch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-reward-continue-touch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control script
        uses: actions/checkout@v4
        with:
          ref: main
          path: control

      - name: Checkout Tarnished Covenant assets
        uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
          path: app

      - name: Apply reward Continue touch repair
        run: python control/.github/scripts/patch-reward-continue-touch.py app

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/tarnished-covenant.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tarnished-covenant.js

      - name: Commit reward Continue repair
        working-directory: app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html tarnished-covenant/build-reward-slot.py
          if git diff --cached --quiet; then
            echo 'Already repaired.'
          else
            git commit -m 'Repair reward Continue touch target'
            git push origin tarnished-covenant-assets
          fi
