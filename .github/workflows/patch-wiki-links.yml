name: Patch Covenant Wiki Links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-wiki-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
      - name: Add contextual wiki links
        run: python tarnished-covenant/build-wiki-links.py
      - name: Verify wiki links
        run: |
          grep -q 'Contextual Elden Ring wiki links' tarnished-covenant/index.html
          grep -q 'tcDecorateGraceWiki' tarnished-covenant/index.html
          grep -q 'tcDecorateEncounterWiki' tarnished-covenant/index.html
          grep -q 'tcDecorateCompendiumWiki' tarnished-covenant/index.html
          grep -q 'eldenring.wiki.fextralife.com' tarnished-covenant/index.html
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('tarnished-covenant/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',html,flags=re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/tc.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/tc.js
      - name: Commit wiki links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          git commit -m 'Add contextual Elden Ring wiki links'
          git push origin HEAD:tarnished-covenant-assets
