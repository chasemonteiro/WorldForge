name: Deploy Universal Weapon Accessibility
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-universal-weapon-accessibility.yml']
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tarnished-covenant-assets
          fetch-depth: 0
      - name: Validate patch sources
        run: |
          python -m py_compile tarnished-covenant/build-weapon-accessibility.py
          python -m py_compile tarnished-covenant/test-weapon-accessibility.py
          python -m py_compile tarnished-covenant/build-launch-refresh.py
      - name: Build twice for idempotence
        run: |
          python tarnished-covenant/build-launch-refresh.py
          python tarnished-covenant/build-launch-refresh.py
      - name: Verify universal weapon gates
        run: |
          python tarnished-covenant/test-weapon-accessibility.py
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('tarnished-covenant/index.html').read_text()
          Path('/tmp/tc.js').write_text('\n'.join(re.findall(r'<script(?:[^>]*)>(.*?)</script>',h,flags=re.S)))
          PY
          node --check /tmp/tc.js
      - name: Commit generated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tarnished-covenant/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Generalize weapon acquisition gates across full run'
            git fetch origin tarnished-covenant-assets
            git rebase origin/tarnished-covenant-assets
            git push origin HEAD:tarnished-covenant-assets
          fi
